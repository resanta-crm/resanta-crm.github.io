<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#185FA5">
<meta http-equiv="Cache-Control" content="no-store">
<title>Resanta Склад · ТСД</title>
<link rel="manifest" href="/tsd-manifest.webmanifest?v=242">
<link rel="icon" href="/inventory-icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f8;color:#111827}
button{font:inherit}.hidden{display:none!important}
#menu{min-height:100%;padding:18px 14px 28px;max-width:760px;margin:auto}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:56px;height:56px;border-radius:15px;background:#185FA5;color:white;display:grid;place-items:center;font-size:30px}.title{font-weight:900;font-size:24px}.sub{font-size:13px;color:#64748b;line-height:1.45}
.card{background:#fff;border:1px solid #d1d5db;border-radius:18px;padding:16px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.actions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.action{border:2px solid #dbe3ec;background:#fff;border-radius:18px;padding:18px;text-align:left;min-height:112px;display:flex;align-items:center;gap:16px;cursor:pointer}
.action:active{transform:scale(.99);background:#eff6ff}.ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:31px;background:#eff6ff}.action b{display:block;font-size:20px;margin-bottom:5px}.action span{font-size:13px;color:#64748b;line-height:1.35}
.install{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;background:#185FA5;color:#fff;font-weight:900;font-size:16px}
#work{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;background:#f4f6f8;display:flex;flex-direction:column}
.workbar{height:54px;flex:0 0 54px;background:#185FA5;color:#fff;display:flex;align-items:center;gap:8px;padding:7px 9px;box-shadow:0 2px 8px rgba(15,23,42,.18);z-index:5}
.workbar button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:8px 11px;font-weight:800}.workbar .name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
iframe{border:0;width:100%;height:calc(100vh - 54px);height:calc(100dvh - 54px);min-height:0;flex:1 1 auto;display:block;background:#fff}
.note{font-size:12px;color:#64748b;margin-top:12px;line-height:1.4}
@media(min-width:620px){.actions{grid-template-columns:1fr 1fr}.action:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<section id="menu">
 <div class="head"><div class="logo">🏭</div><div><div class="title">Resanta Склад</div><div class="sub">Единый рабочий экран ТСД</div></div></div>
 <div class="card">
  <b style="font-size:18px">Что будем делать?</b>
  <div class="actions">
   <button class="action" data-url="/receiving.html?v=245" data-name="Приёмка товара"><span class="ico">📥</span><span><b>Приёмка товара</b>Принимать машину по УПД и сканировать товар.</span></button>
   <button class="action" data-url="/inventory.html?v=244" data-name="Инвентаризация"><span class="ico">📋</span><span><b>Инвентаризация</b>Пересчёт склада через ТСД.</span></button>
   <button class="action" data-url="/picking.html?standalone=1&v=244" data-name="Заказы"><span class="ico">📦</span><span><b>Заказы</b>Собирать назначенные ОМ счета и подтверждать готовность.</span></button>
  </div>
  <button id="install" class="install hidden">⬇ Установить «Resanta Склад»</button>
  <div class="note">Один ярлык на терминале. Приёмка, инвентаризация и заказы остаются отдельными защищёнными модулями внутри него.</div>
 </div>
</section>
<section id="work" class="hidden">
 <div class="workbar"><button id="back">← Меню</button><div id="workname" class="name">Resanta Склад</div><button id="reload">↻</button></div>
 <iframe id="frame" allow="clipboard-read; clipboard-write"></iframe>
</section>
<script>
'use strict';
const HUB_VERSION='2026-10-07-v23.6.245-receiving-scanner-fix';
let installPrompt=null;
const $=id=>document.getElementById(id);
const PICKING_FAST_URL='/picking.html?standalone=1&v=243';
function moduleUrl(url){return String(url||'').startsWith('/picking.html')?PICKING_FAST_URL:url}
let moduleAttempt=0,moduleWatchdog=null,moduleReady=false;
function freshUrl(target,attempt=1){
 const u=new URL(target,location.origin);
 u.searchParams.set('hub','243');
 u.searchParams.set('attempt',String(attempt));
 u.searchParams.set('open',String(Date.now()));
 return u.pathname+u.search
}
async function purgePickingRuntime(){
 try{
  if(window.caches&&caches.keys){
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>k.startsWith('resanta-picking-')).map(k=>caches.delete(k)))
  }
 }catch(_){}
 try{
  if('serviceWorker'in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.filter(r=>String(r.active?.scriptURL||r.waiting?.scriptURL||r.installing?.scriptURL||'').includes('/picking-sw.js')).map(r=>r.unregister().catch(()=>false)))
  }
 }catch(_){}
}
function armModuleWatchdog(target){
 clearTimeout(moduleWatchdog);
 if(!String(target).startsWith('/picking.html'))return;
 moduleWatchdog=setTimeout(async()=>{
  if(moduleReady||$('work').classList.contains('hidden'))return;
  const f=$('frame');if(!f)return;
  moduleAttempt+=1;
  await purgePickingRuntime();
  f.dataset.moduleUrl=target;
  f.src=freshUrl(target,moduleAttempt);
  clearTimeout(moduleWatchdog);
  moduleWatchdog=setTimeout(()=>{
   if(moduleReady||$('work').classList.contains('hidden'))return;
   try{
    const d=f.contentDocument;
    if(d&&d.body&&!d.body.textContent.trim()){
      d.body.innerHTML='<div style="font-family:Arial;padding:18px;color:#991b1b"><b>Модуль заказов не загрузился.</b><br><br>Нажмите верхнюю кнопку ↻ — CRM уже очистила старый кэш ТСД.</div>'
    }
   }catch(_){}
  },3200)
 },1600)
}
function openModule(url,name){
 const target=moduleUrl(url);
 if(target.indexOf('/picking.html')===0){
   try{sessionStorage.setItem('resanta_tsd_last_module_v1',JSON.stringify({url:target,name}))}catch(_){}
   location.replace(freshUrl(target,1));
   return
 }
 const f=$('frame');$('workname').textContent=name||'Resanta Склад';
 moduleReady=false;moduleAttempt=1;
 f.dataset.moduleUrl=target;
 f.src=freshUrl(target,moduleAttempt);
 $('menu').classList.add('hidden');$('work').classList.remove('hidden');
 try{sessionStorage.setItem('resanta_tsd_last_module_v1',JSON.stringify({url:target,name}))}catch(_){}
}
function menu(){
 clearTimeout(moduleWatchdog);moduleWatchdog=null;moduleReady=false;
 $('work').classList.add('hidden');$('menu').classList.remove('hidden');
 const f=$('frame');if(f){f.removeAttribute('src');delete f.dataset.moduleUrl}
}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.data?.type!=='resanta-picking-ready')return;
 moduleReady=true;clearTimeout(moduleWatchdog);moduleWatchdog=null
});
document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>openModule(b.dataset.url,b.dataset.name));
$('back').onclick=menu;
$('reload').onclick=()=>{
 const f=$('frame'),target=f?.dataset?.moduleUrl;
 if(!f||!target)return;
 moduleReady=false;moduleAttempt+=1;
 if(String(target).startsWith('/picking.html'))purgePickingRuntime().finally(()=>{f.src=freshUrl(target,moduleAttempt);armModuleWatchdog(target)});
 else f.src=freshUrl(target,moduleAttempt)
};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').classList.remove('hidden')});
$('install').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').classList.add('hidden')};
window.addEventListener('appinstalled',()=>{installPrompt=null;$('install').classList.add('hidden')});
// Online warehouse shell: do not let a stale hub service worker hold a TSD
// on the Android/PWA splash screen. Modules manage their own runtime.
if('serviceWorker'in navigator){
 navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(
  rs.filter(r=>{
   const u=String(r.active?.scriptURL||r.waiting?.scriptURL||r.installing?.scriptURL||'');
   return u.includes('/tsd/sw.js')||u.includes('/tsd-sw.js')
  }).map(r=>r.unregister().catch(()=>false))
 )).catch(()=>{});
}
if(window.caches&&caches.keys)caches.keys().then(keys=>Promise.all(
 keys.filter(k=>k.startsWith('resanta-tsd-hub-')).map(k=>caches.delete(k))
)).catch(()=>{});
</script>
</body>
</html>
