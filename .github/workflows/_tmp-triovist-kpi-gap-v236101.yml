name: TEMP — Triovist KPI and gap v23.6.101

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_tmp-triovist-kpi-gap-v236101.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow synchronized legacy duplicates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/_tmp_patch_triovist_v236101.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if count != 1:","if count < 1:")
          s=s.replace("return text.replace(old, new, 1)","return text.replace(old, new)")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply focused patch
        run: python .github/_tmp_patch_triovist_v236101.py
      - name: Validate JavaScript and diff
        run: |
          set -euo pipefail
          node --check assets/03-triovist-routes.js
          node --check assets/11-triovist-ai-plans-v2348.js
          node --check assets/62-triovist-task-ux-v23653.js
          node --check assets/66-performance-root-v23657.js
          git diff --check
      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/03-triovist-routes.js assets/11-triovist-ai-plans-v2348.js assets/66-performance-root-v23657.js index.html
          git rm .github/workflows/_tmp-triovist-kpi-gap-v236101.yml .github/_tmp_patch_triovist_v236101.py
          git commit -m 'Triovist: correct monthly KPI and sales gap sources (v23.6.101)'
          git pull --rebase origin main
          git push origin main
