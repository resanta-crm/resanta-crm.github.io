name: TEMP hotfix CRM reload loop v23.6.119

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-hotfix-reload-loop-v236119.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch frontend version contract and one-shot reload guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('assets/66-performance-root-v23657.js')
          s = root.read_text(encoding='utf-8')
          s, n = re.subn(r"const V='23\.6\.\d+'", "const V='23.6.119'", s, count=1)
          if n != 1:
              raise SystemExit('Cannot patch root V')

          old = """    if(remote&&remote!==V){
      frontendReloading=true;
      const b=document.getElementById('crm-update-banner');
      if(b){b.textContent='CRM обновлена. Загружаем новую версию…';b.classList.add('show')}
      setTimeout(()=>location.reload(),250);
      return true;
    }
"""
          new = """    if(remote&&remote!==V){
      const reloadKey='crm_frontend_reload_target_v236119';
      let attempted='';
      try{attempted=sessionStorage.getItem(reloadKey)||''}catch(_){}
      if(attempted===remote){
        // Never trap the user in an endless reload loop if one cached module lags behind.
        console.warn('CRM version mismatch persisted after one reload:',{loaded:V,remote});
        const b=document.getElementById('crm-update-banner');
        if(b)b.classList.remove('show');
        return false;
      }
      try{sessionStorage.setItem(reloadKey,remote)}catch(_){}
      frontendReloading=true;
      const b=document.getElementById('crm-update-banner');
      if(b){b.textContent='CRM обновлена. Загружаем новую версию…';b.classList.add('show')}
      setTimeout(()=>location.reload(),250);
      return true;
    }
    try{sessionStorage.removeItem('crm_frontend_reload_target_v236119')}catch(_){}
"""
          if old not in s:
              raise SystemExit('Cannot patch reload guard')
          s = s.replace(old, new, 1)
          root.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          h, n1 = re.subn(r"const APP_VERSION = '2026-09-14-resanta-crm-v23\.6\.\d+';", "const APP_VERSION = '2026-09-14-resanta-crm-v23.6.119';", h, count=1)
          h, n2 = re.subn(r"(assets/66-performance-root-v23657\.js\?v=)23\.6\.\d+", r"\g<1>23.6.119", h, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Cannot patch index version refs: APP={n1}, root={n2}')
          idx.write_text(h, encoding='utf-8')

          vp = Path('data/app-version.json')
          data = json.loads(vp.read_text(encoding='utf-8'))
          data.update({
              'version':'23.6.119',
              'released_at':'2026-09-14',
              'purpose':'Hotfix: остановлен цикл перезагрузки CRM; версия root и app-version синхронизированы',
              'deploy_trigger':'2026-09-14T11:16:00Z'
          })
          vp.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/_tmp-hotfix-reload-loop-v236119.yml
          git add assets/66-performance-root-v23657.js index.html data/app-version.json
          git commit -m 'fix: stop frontend version reload loop v23.6.119'
          git pull --rebase origin main
          git push origin HEAD:main
