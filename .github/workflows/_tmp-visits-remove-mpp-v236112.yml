name: TEMP visits cleanup v23.6.112

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-visits-remove-mpp-v236112.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply version bump
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          idxp=Path('index.html')
          rootp=Path('assets/66-performance-root-v23657.js')
          verp=Path('data/app-version.json')
          visitp=Path('assets/35-visits-quality-mpp-v23615.js')

          idx=idxp.read_text(encoding='utf-8')
          root=rootp.read_text(encoding='utf-8')
          visit=visitp.read_text(encoding='utf-8')

          if "legacyMppFilterRemoved:true" not in visit or "bossMppFilter:false" not in visit:
              raise SystemExit('Visits MPP cleanup patch missing')
          if "allVisits=filteredVisits" in visit or "allRoutePlans=filteredRoutes" in visit:
              raise SystemExit('Legacy dataset mutation still present')

          idx,n1=re.subn(r"const APP_VERSION = '[^']+';", "const APP_VERSION = '2026-09-14-resanta-crm-v23.6.112';", idx, count=1)
          idx,n2=re.subn(r"assets/66-performance-root-v23657\.js\?v=[^\"']+", "assets/66-performance-root-v23657.js?v=23.6.112", idx)
          if n1!=1 or n2<1:
              raise SystemExit(f'index anchors app={n1} root={n2}')

          if "const V='23.6.111'" not in root:
              raise SystemExit('performance root version anchor missing')
          root=root.replace("const V='23.6.111'", "const V='23.6.112'", 1)

          ver=json.loads(verp.read_text(encoding='utf-8'))
          ver['version']='23.6.112'
          ver['released_at']='2026-09-14'
          ver['purpose']='Визиты: удалён ошибочный МПП-фильтр без изменения GPS, маршрутов и истории'
          ver['deploy_trigger']='2026-09-14T08:30:00Z'

          idxp.write_text(idx,encoding='utf-8')
          rootp.write_text(root,encoding='utf-8')
          verp.write_text(json.dumps(ver,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node --check assets/35-visits-quality-mpp-v23615.js
          node --check assets/66-performance-root-v23657.js
          python -m json.tool data/app-version.json >/dev/null
          git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git rm .github/workflows/_tmp-visits-remove-mpp-v236112.yml
          git add index.html assets/66-performance-root-v23657.js data/app-version.json assets/35-visits-quality-mpp-v23615.js
          git commit -m 'fix(visits): remove MPP filter permanently v23.6.112'
          git push origin HEAD:main
