name: Publish Resanta CRM Pages — VERIFIED API

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - CNAME
      - robots.txt
      - manifest.json
      - service-worker.js
      - assets/**
      - icons/**
      - .github/workflows/publish-crm-pages-verified.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: resanta-crm-pages
  cancel-in-progress: true

env:
  SITE_URL: https://resanta-crm.by
  DEPLOY_MARKER: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  publish:
    name: VERIFIED API publish and live check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://resanta-crm.by

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare clean site artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          test -s index.html
          cp index.html _site/index.html

          for file in CNAME robots.txt manifest.json service-worker.js; do
            if [ -f "$file" ]; then
              cp "$file" "_site/$file"
            fi
          done

          for dir in assets icons; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done

          touch _site/.nojekyll
          printf '%s' "$DEPLOY_MARKER" > _site/deploy-version.txt
          sha256sum _site/index.html | awk '{print $1}' > _site/deploy-index.sha256

          echo "Deployment marker: $DEPLOY_MARKER"
          echo "Index SHA-256: $(cat _site/deploy-index.sha256)"
          echo "Files prepared for publication:"
          find _site -maxdepth 3 -type f -print | sort

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Create Pages deployment without broken status polling
        id: create_deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail

          test -n "$ARTIFACT_ID"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

          echo "Requesting GitHub Actions OIDC token..."
          OIDC_RESPONSE="$({
            curl --fail --silent --show-error --location \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --header "Accept: application/json; api-version=2.0" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL"
          })"

          ID_TOKEN="$(jq -r '.value // empty' <<<"$OIDC_RESPONSE")"
          test -n "$ID_TOKEN"

          PAYLOAD="$(jq -n \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg pages_build_version "$DEPLOY_MARKER" \
            --arg oidc_token "$ID_TOKEN" \
            '{
              artifact_id: $artifact_id,
              environment: "github-pages",
              pages_build_version: $pages_build_version,
              oidc_token: $oidc_token
            }')"

          echo "Creating Pages deployment for marker $DEPLOY_MARKER and artifact $ARTIFACT_ID..."
          RESPONSE="$({
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments" \
              --data "$PAYLOAD"
          })"

          DEPLOYMENT_ID="$(jq -r '.id // (.status_url | split("/") | last) // empty' <<<"$RESPONSE")"
          PAGE_URL="$(jq -r '.page_url // empty' <<<"$RESPONSE")"

          echo "Pages API response: $(jq -c '{id, status, page_url, status_url}' <<<"$RESPONSE")"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Verify the exact version published on the live domain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail

          LOCAL_HASH="$(cat _site/deploy-index.sha256)"
          MARKER_URL="$SITE_URL/deploy-version.txt"
          INDEX_URL="$SITE_URL/index.html"

          echo "Waiting for the live site to expose marker: $DEPLOY_MARKER"
          echo "Expected index SHA-256: $LOCAL_HASH"

          for attempt in $(seq 1 60); do
            CACHE_BUST="$DEPLOY_MARKER-$(date +%s%N)"

            REMOTE_MARKER="$(
              curl --fail --silent --show-error --location \
                --max-time 15 \
                --header 'Cache-Control: no-cache, no-store, must-revalidate' \
                --header 'Pragma: no-cache' \
                "$MARKER_URL?v=$CACHE_BUST" 2>/dev/null || true
            )"

            API_STATUS="unknown"
            if [ -n "${DEPLOYMENT_ID:-}" ]; then
              API_STATUS="$(
                curl --fail --silent --show-error --location \
                  --max-time 15 \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments/$DEPLOYMENT_ID" 2>/dev/null \
                | jq -r '.status // "unknown"' 2>/dev/null || true
              )"
              [ -n "$API_STATUS" ] || API_STATUS="unknown"
            fi

            echo "Attempt $attempt/60: API status=$API_STATUS; live marker=${REMOTE_MARKER:-not-yet-published}"

            if [ "$REMOTE_MARKER" = "$DEPLOY_MARKER" ]; then
              REMOTE_HASH="$(
                curl --fail --silent --show-error --location \
                  --max-time 30 \
                  --header 'Cache-Control: no-cache, no-store, must-revalidate' \
                  --header 'Pragma: no-cache' \
                  "$INDEX_URL?v=$CACHE_BUST" \
                | sha256sum | awk '{print $1}'
              )"

              if [ "$REMOTE_HASH" = "$LOCAL_HASH" ]; then
                echo "Verified: the live CRM contains this exact index.html."
                echo "Published marker: $REMOTE_MARKER"
                echo "Published SHA-256: $REMOTE_HASH"
                exit 0
              fi

              echo "Marker is current, but edge cache still serves another index hash. Retrying..."
              echo "Remote SHA-256: $REMOTE_HASH"
            fi

            sleep 10
          done

          echo "ERROR: the live domain did not publish the exact requested CRM version within 10 minutes." >&2
          echo "Expected marker: $DEPLOY_MARKER" >&2
          echo "Expected SHA-256: $LOCAL_HASH" >&2
          exit 1
