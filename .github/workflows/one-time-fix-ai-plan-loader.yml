name: One-time exact AI plan loader fix

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-ai-plan-loader.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact index and change one loader version
        shell: bash
        run: |
          set -euo pipefail
          BASE='6b31b337daa66e96d1bfed6bda4d902644d3b8c1'
          git show "$BASE:index.html" > index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script defer src="./assets/07-ai-manager-plans.js?v=23.1.1"></script>'
          new = '<script defer src="./assets/07-ai-manager-plans.js?v=23.2.0"></script>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one loader line, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          expected=$'1\t1\tindex.html'
          actual="$(git diff --numstat "$BASE" -- index.html)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected index diff: $actual"
            git diff "$BASE" -- index.html
            exit 1
          fi

          rm .github/workflows/one-time-fix-ai-plan-loader.yml
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-time-fix-ai-plan-loader.yml
          git commit -m 'Set AI manager plans loader to 23.2.0 only'
          git push origin HEAD:main
