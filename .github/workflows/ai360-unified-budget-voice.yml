name: AI360 unified budget voice security and formula
on:
  pull_request:
    paths:
      - 'supabase/functions/crm-ai360-budget-voice-v1/**'
      - 'assets/143-resanta-ai360-unified-dialog-v1.js'
      - 'assets/147-resanta-ai360-staff-unified-dialog-v1.js'
      - 'tests/ai360-unified-budget-voice.test.mjs'
      - '.github/workflows/ai360-unified-budget-voice.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/crm-ai360-budget-voice-v1/**'
      - 'assets/143-resanta-ai360-unified-dialog-v1.js'
      - 'assets/147-resanta-ai360-staff-unified-dialog-v1.js'
      - 'tests/ai360-unified-budget-voice.test.mjs'
      - '.github/workflows/ai360-unified-budget-voice.yml'
permissions:
  contents: read
jobs:
  secure-finance-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check supabase/functions/crm-ai360-budget-voice-v1/finance.mjs
          node --test tests/ai360-unified-budget-voice.test.mjs
          node --check assets/143-resanta-ai360-unified-dialog-v1.js
          node --check assets/147-resanta-ai360-staff-unified-dialog-v1.js
