name: AIR3 AI360 real voice app and server checks (isolated)
on:
  pull_request:
    paths:
      - 'android/air3-ai360/**'
      - 'supabase/functions/crm-ai360-air3-v2/**'
      - '.github/workflows/air3-ai360-native-check.yml'
      - 'assets/air3-stage-director-v1.js'
      - 'air3-stage.html'
      - 'air3-control.html'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Enable Android SDK tools
        run: |
          test -d "$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          echo "$(dirname "$SDK_MANAGER")" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile native voice APK
        working-directory: android/air3-ai360
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify shared-device security boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android/air3-ai360/app/src/main/java/by/resanta/air3/MainActivity.java').read_text()
          m=Path('android/air3-ai360/app/src/main/AndroidManifest.xml').read_text()
          assert 'allowBackup="false"' in m
          assert 'usesCleartextTraffic="false"' in m
          assert 'CookieManager' not in s
          assert 'getSharedPreferences("air3_device_identity"' in s
          assert '"trusted_device_id"' in s and 'AndroidKeyStore' in s
          assert 'putString("token"' not in s and 'putString("secret"' not in s
          assert 'signChallenge' in s and 'beginFastSignIn' in s
          assert 'SERVICE_ROLE_KEY' not in s and 'SUPABASE_ANON_KEY' not in s
          assert 'RECORD_AUDIO' in m and 'getCacheDir()' in s
          assert 'audio_base64' in s and 'crm-ai360-air3-v2' in s
          print('isolated AIR3 AI360 native security baseline PASS')
          PY
      - name: Physical-demo wake phrase / finite-mic regression
        run: bash android/air3-ai360/demo-phrase-test.sh
      - name: Authentic CRM in glasses contract (not a fake dashboard)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('android/air3-ai360/app/src/main/java/by/resanta/air3/RealCRMView.java').read_text()
          a=Path('android/air3-ai360/app/src/main/java/by/resanta/air3/MainActivity.java').read_text()
          assert 'https://resanta-crm.by/index.html' in r, 'must display the ORIGINAL production CRM'
          assert 'new WebView(activity)' in r
          assert 'setJavaScriptEnabled(true)' in r and 'setDomStorageEnabled(true)' in r
          assert "getElementById('nav-sales')" in r and 'b.click()' in r, 'real navigation only'
          assert 'shouldOverrideUrlLoading' in r and 'CRM_HOST.equalsIgnoreCase(url.getHost())' in r
          assert 'addJavascriptInterface' not in r and 'loadDataWithBaseURL' not in r
          assert 'WebStorage.getInstance().deleteAllData()' in r
          assert 'CookieManager.getInstance().removeAllCookies(null)' in r
          assert 'setAcceptThirdPartyCookies(web,false)' in r
          assert 'closeOriginalCrm()' in a and 'onPause()' in a
          assert 'main.postDelayed(this::showOriginalCrm,250)' in a
          assert 'handleUsbIntent(getIntent());' in a
          assert 'onNewIntent(Intent intent)' in a
          assert 'resanta_usb_pair' in a and 'pairWithCode(provision,true)' in a
          assert 'resanta_usb_disconnect' in a and 'disconnectUsb' in a
          assert 'main.postDelayed(quickPoll,2500)' in a
          assert 'android:launchMode="singleTop"' in Path('android/air3-ai360/app/src/main/AndroidManifest.xml').read_text()
          pult=Path('air3-control.html').read_text()
          assert 'air3-usb-prepare' in pult
          assert "await navigator.clipboard.writeText('AIR3USB:'+result.code)" in pult
          assert 'button(\'Разрешить вход\',\'approve\')' in pult
          assert 'code.textContent=result.code' in pult  # Original fallback retained
          connect=Path('android/air3-ai360/mac/AIR3-USB-Connect.command').read_text()
          disconnect=Path('android/air3-ai360/mac/AIR3-USB-Disconnect.command').read_text()
          assert 'pbpaste' in connect and 'AIR3USB:' in connect and 'resanta_usb_pair' in connect
          assert 'resanta_usb_disconnect' in disconnect and 'pm clear by.resanta.air3' in disconnect
          assert 'grep -Fq "usb_revoke_confirmed:$NONCE"' in disconnect
          assert 'showOriginalCrm();' in a.split('onCreate(Bundle b)')[1].split('private TextView text(')[0], 'first screen must be real CRM'
          assert 'if(!connected()){message("Сначала подтверди очки на MacBook.")' not in a
          assert 'new RealCRMView(this,this::openVoiceOrDemo,this::close)' in a
          assert 'setVoiceConnected(connected())' in a
          assert 'setVoiceConnected(boolean connected)' in r
          assert 'closeOriginalCrm();' in a.split('onStop()')[1].split('onResume()')[0], 'privacy cleanup on actual background'
          assert 'navigateOriginalCrm(domain)' in a
          assert 'actualCrm.showStatus("Распознано: "+spoken)' in a
          assert 'putString("token"' not in a and 'SUPABASE_SERVICE_ROLE_KEY' not in r+a
          print('Real CRM website on AIR3, native voice navigation, cleanup PASS')
          PY
      - name: Validate macOS USB helpers shell syntax
        run: |
          bash -n android/air3-ai360/mac/AIR3-USB-Connect.command
          bash -n android/air3-ai360/mac/AIR3-USB-Disconnect.command
      - uses: actions/upload-artifact@v4
        with:
          name: resanta-ai360-air3-native-debug
          path: android/air3-ai360/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  server-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Typecheck voice bridge and imports
        run: deno check --allow-import supabase/functions/crm-ai360-air3-v2/index.ts
      - name: Server boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/crm-ai360-air3-v2')
          a=(p/'auth.ts').read_text()
          d=(p/'dialog.ts').read_text()
          v=(p/'voice.ts').read_text()
          x=(p/'index.ts').read_text()
          assert '3600000' in a and '600000' in a and 'device_secret_hash' in a
          assert 'status' in a and 'revoked_at' in a
          assert "await authorized(token" in x and "if(action==='create')" not in x
          assert 'runToolCore' in d and 'guardVoicePair' in d
          assert "crm_ai360_core_claim_v2" in d and 'crm_ai360_core_finish_v2' in d
          assert 'crm_ai360_stt_claim_v2' in v and 'crm_ai360_yandex_monthly_claim_v1' in v
          assert 'SERVICE_ROLE_KEY' not in (p/'index.ts').read_text()
          stage=(p/'stage.ts').read_text()
          fast=(p/'fast.ts').read_text()
          assert 'browserOwner(req)' in stage and 'ownerPresent(id)' in stage
          assert 'publishNavigation' in stage and 'checkStage(stage)' in stage
          assert "stage_poll" in x and "stage_open" in x
          assert "crypto.subtle.verify" in fast and "challenge_replayed" in fast
          assert 'ownerPresent' in fast and 'enroll' in fast
          assert "device_revoke" in x
          print('fast approval and stage authorization boundaries PASS')
          print('server-auth and budget contract PASS')
          PY
  projector-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check original CRM stage navigation
        run: |
          node --check assets/air3-stage-director-v1.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('air3-stage.html','utf8');
          const js=fs.readFileSync('assets/air3-stage-director-v1.js','utf8');
          assert(html.includes('iframe id="crm"'));
          assert(js.includes("setAttribute('src','./index.html')"));
          assert(js.includes('target.click()'));
          assert(js.includes("pointer-events:none")===false); // CSS, not script
          assert(html.includes('pointer-events:none'));
          assert(!js.includes('innerHTML='));
          assert(js.includes("document.body.classList.remove('running')"));
          new vm.Script(js);
          assert(!html.includes('service_role'));
          console.log('Original CRM projection + privacy shutter PASS');
          JS
