name: Triovist Search360 user-requested deep 21vek scans
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/triovist_21vek_search360.py'
      - '.github/workflows/triovist-search360-worker.yml'
permissions:
  contents: read
concurrency:
  group: triovist-search360-deep-listing
  cancel-in-progress: false
jobs:
  deep-search:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Process at most two explicit 21vek search requests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEARCH360_JOBS_PER_RUN: '2'
          SEARCH360_PAGE_PAUSE_SECONDS: '1.4'
          TOP_HTTP_TIMEOUT: '25'
          TOP_DELAY_SECONDS: '1.0'
        run: python tools/triovist_21vek_search360.py
