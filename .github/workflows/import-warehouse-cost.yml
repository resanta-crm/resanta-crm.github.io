name: Себестоимость склада Витебск — автообновление

on:
  push:
    branches: [main]
    paths:
      - 'import_warehouse_cost.py'
      - '.github/workflows/import-warehouse-cost.yml'
  schedule:
    # Минск UTC+3. Письмо 1С обычно приходит около 07:30.
    # Несколько запусков после письма страхуют задержки GitHub/Gmail.
    - cron: '0 5,8,11,14,17 * * *'   # 08:00, 11:00, 14:00, 17:00, 20:00 Минск
  workflow_dispatch:

concurrency:
  group: warehouse-cost-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Забрать код
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: pip install --disable-pip-check requests
      - name: Проверить синтаксис
        run: python -m py_compile import_warehouse_cost.py
      - name: Импортировать себестоимость из Gmail
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WAREHOUSE_COST_LOOKBACK_DAYS: '10'
          WAREHOUSE_COST_IMAP_TIMEOUT_SECONDS: '45'
        run: python import_warehouse_cost.py
