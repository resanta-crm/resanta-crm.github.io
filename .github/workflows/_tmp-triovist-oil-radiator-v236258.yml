name: TMP — Triovist oil radiator market v23.6.258

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-triovist-oil-radiator-v236258.yml'
  workflow_dispatch:

concurrency:
  group: triovist-oil-radiator-v236258
  cancel-in-progress: true

jobs:
  oil-radiator-market:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: |
          python -m py_compile tools/triovist_21vek_market.py tools/triovist_21vek_parser.py
          node --check assets/106-triovist-competitors-v236218.js
      - name: Dependencies
        run: pip install requests beautifulsoup4
      - name: Oil radiators only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MARKET_VALIDATE_PROFILES: 'oil_radiator'
          MARKET_DELAY_SECONDS: '0.22'
          MARKET_HTTP_TIMEOUT: '30'
          MARKET_SPEC_TTL_DAYS: '30'
        run: python tools/triovist_21vek_market.py
