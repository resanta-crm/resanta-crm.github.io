name: Triovist Demand AI V2 and budget tab resume regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/175-triovist-motivation-director-v1.js'
      - 'assets/179-triovist-demand-ai-v1.js'
      - 'assets/178-crm-view-resume-v1.js'
      - 'assets/34-triovist-root-v23614.js'
      - 'tests/triovist-demand-ai-v2.test.mjs'
      - 'tests/crm-view-resume-v1.test.mjs'
      - 'tests/triovist-motivation-director-v1.test.mjs'
      - 'supabase/migrations/20261105_triovist_ai_demand_preview_v1.sql'
      - 'supabase/migrations/20261105_triovist_ai_task_draft_v1.sql'
      - '.github/workflows/triovist-demand-ai-v2-budget-resume.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all changed UI without touching live CRM
        run: |
          node --check assets/175-triovist-motivation-director-v1.js
          node --check assets/179-triovist-demand-ai-v1.js
          node --check assets/178-crm-view-resume-v1.js
          node --check assets/34-triovist-root-v23614.js
      - name: Verify seasonality, +15%, manual task approval, old plan approvals and Budget resume
        run: |
          node --test tests/triovist-demand-ai-v2.test.mjs tests/triovist-motivation-director-v1.test.mjs tests/crm-view-resume-v1.test.mjs tests/triovist-tasks360-ux-v1.test.mjs
      - name: Full prior Uni X, Cards 21vek and competitor listing regression
        run: |
          node --test tests/triovist-unix-director-v1.test.mjs tests/triovist-summary-360-v1.test.mjs tests/triovist-competitors-uni-listing.test.mjs tests/triovist-competitors-uni-cache.test.mjs tests/triovist-native-sections-v1.test.mjs tests/triovist-stock-director-v1.test.mjs
      - name: Validate only additive RPC files exist
        run: |
          test -f supabase/migrations/20261105_triovist_ai_demand_preview_v1.sql
          test -f supabase/migrations/20261105_triovist_ai_task_draft_v1.sql
          grep -q 'REVOKE ALL ON FUNCTION' supabase/migrations/20261105_triovist_ai_demand_preview_v1.sql
          grep -q 'REVOKE ALL ON FUNCTION' supabase/migrations/20261105_triovist_ai_task_draft_v1.sql
          ! grep -E 'TRUNCATE|DROP TABLE|DELETE FROM public.triovist_ai_tasks|ALTER TABLE' supabase/migrations/20261105_triovist_ai_*.sql
      - name: Ensure parser, cards, old task data and roles remain untouched
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD | tee /tmp/changes
          ! grep -E '^assets/(01-crm-core|03-triovist-routes|80-triovist-21vek-control-v236107|106-triovist-competitors-v236218|173-triovist-native-sections-v1|61-triovist-task-month-safe-v23651)[.]js$' /tmp/changes
          ! (grep '^supabase/migrations/' /tmp/changes | grep -v '^supabase/migrations/20261105_triovist_ai_')
