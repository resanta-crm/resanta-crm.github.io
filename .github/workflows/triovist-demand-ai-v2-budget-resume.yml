name: Triovist Demand AI V2 and budget tab resume regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/175-triovist-motivation-director-v1.js'
      - 'assets/179-triovist-demand-ai-v1.js'
      - 'assets/178-crm-view-resume-v1.js'
      - 'assets/34-triovist-root-v23614.js'
      - 'tests/triovist-demand-ai-v2.test.mjs'
      - 'assets/61-triovist-task-month-safe-v23651.js'
      - 'assets/169-triovist-tasks360-ux-v1.js'
      - 'supabase/migrations/20261105_triovist_ai_brainstorm_*'
      - 'tests/crm-view-resume-v1.test.mjs'
      - 'tests/triovist-motivation-director-v1.test.mjs'
      - 'supabase/migrations/20261105_triovist_ai_demand_preview_v1.sql'
      - 'supabase/migrations/20261105_triovist_ai_task_draft_v1.sql'
      - '.github/workflows/triovist-demand-ai-v2-budget-resume.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all changed UI without touching live CRM
        run: |
          node --check assets/175-triovist-motivation-director-v1.js
          node --check assets/179-triovist-demand-ai-v1.js
          node --check assets/178-crm-view-resume-v1.js
          node --check assets/34-triovist-root-v23614.js
      - name: Verify seasonality, +15%, manual task approval, old plan approvals and Budget resume
        run: |
          node --test tests/triovist-demand-ai-v2.test.mjs tests/triovist-motivation-director-v1.test.mjs tests/crm-view-resume-v1.test.mjs tests/triovist-tasks360-ux-v1.test.mjs
      - name: Full prior Uni X, Cards 21vek and competitor listing regression
        run: |
          node --test tests/triovist-unix-director-v1.test.mjs tests/triovist-summary-360-v1.test.mjs tests/triovist-competitors-uni-listing.test.mjs tests/triovist-competitors-uni-cache.test.mjs tests/triovist-native-sections-v1.test.mjs tests/triovist-stock-director-v1.test.mjs
      - name: Validate only additive RPC files exist
        run: |
          test -f supabase/migrations/20261105_triovist_ai_demand_preview_v1.sql
          test -f supabase/migrations/20261105_triovist_ai_task_draft_v1.sql
          grep -q 'REVOKE ALL ON FUNCTION' supabase/migrations/20261105_triovist_ai_demand_preview_v1.sql
          grep -q 'REVOKE ALL ON FUNCTION' supabase/migrations/20261105_triovist_ai_task_draft_v1.sql
          test -f supabase/migrations/20261105_triovist_ai_brainstorm_subgroups_preview_v2.sql
          test -f supabase/migrations/20261105_triovist_ai_brainstorm_approve_v2.sql
          test -f supabase/migrations/20261105_triovist_ai_brainstorm_verify_v2.sql
          ! grep -E 'TRUNCATE|DROP TABLE|DELETE FROM public.triovist_ai_tasks|ALTER TABLE' supabase/migrations/20261105_triovist_ai_*.sql
      - name: Ensure parser, cards, old task data and roles remain untouched
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD | tee /tmp/changes
          node --test tests/gps360-complete-one-time-geo-v1.test.mjs
          ! grep -E '^assets/(03-triovist-routes|80-triovist-21vek-control-v236107|106-triovist-competitors-v236218|173-triovist-native-sections-v1)[.]js$' /tmp/changes
          # Explicitly reviewed client migrations do not alter Triovist tasks, cards, parser or roles.
          ! (grep '^supabase/migrations/' /tmp/changes | grep -v -E '^supabase/migrations/(20261105_(triovist_ai_.*|gps_director360_(evidence_v1|stop_reviews_v1|live_stops_v1))|20261106_gps360_(safe_history_v1|store_onsite_v1|probable_stops_v1|evidence_completed_v2)|20261106142000_gps360_exact_physical_store_read_v1|20261106143500_gps360_vip_new_clients_guard_v1|20261109_triovist_search360_isolated_v1|20261109_triovist_search360_negative_coverage_v2|20261109_triovist_decisions360_task_facts_v1|20261109_triovist_decisions360_category_evidence_v1|20261109_warehouse_vitebsk360_truth_v1|20261109_warehouse_vitebsk360_order_approval_v1|20261109_warehouse_vitebsk360_approved_document_v1|20261109_gps360_director_decisions_recheck_v1|20261111134000_triovist_market_ai_investigations_v1|20261114075736_clients_unified_security_and_ytd|20261114080346_clients_detail_route_reference_cast|20261114083710_clients_registry_filters_and_journal|20261114091749_clients_journal_polymorphic_trigger|20261114094230_clients_detail_debt_history|20261114095103_clients_explicit_branch_scope)[.]sql$')
