name: TEMP markdown price header v23.6.113

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-markdown-price-header-v236113.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch 1C price header recognition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('import_markdown.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('# RESANTA CRM v23.6.87 · import markdown/discounted goods from 1C email','# RESANTA CRM v23.6.113 · import markdown/discounted goods from 1C email',1)
          old=' "base_price":["дилерская с ндс","цена дилер с ндс","дилер с ндс","цена","базовая цена","цена с ндс","розничная цена","цена продажи","price"],'
          new=' "base_price":["дилерская с ндс","цена дилер с ндс","дилер с ндс","мелкий опт 2 с ндс","мелкий опт с ндс","мелкий опт 2","мелкий опт","отпускная с ндс","отпускная","цена","базовая цена","цена с ндс","розничная цена","цена продажи","price"],'
          if old not in s:
              raise SystemExit('base_price alias anchor not found')
          s=s.replace(old,new,1)
          anchor='''    if "article" not in m or "nomenclature" not in m:\n        raise RuntimeError("В файле обязательны колонки «Артикул» и «Номенклатура».")\n    return m'''
          repl='''    if "base_price" not in m:\n        # 1C can rename the selected price type while preserving the same report layout.\n        # Accept a VAT/wholesale price column instead of silently importing zero rows.\n        candidates=[]\n        for idx,h in enumerate(headers):\n            nh=norm(h)\n            if ("ндс" in nh and any(k in nh for k in ("опт","дилер","цена","отпуск"))) or "мелкий опт" in nh:\n                candidates.append(idx)\n        if len(candidates)==1:\n            m["base_price"]=candidates[0]\n        elif len(candidates)>1:\n            m["base_price"]=candidates[-1]\n    if "article" not in m or "nomenclature" not in m:\n        raise RuntimeError("В файле обязательны колонки «Артикул» и «Номенклатура».")\n    if "base_price" not in m:\n        raise RuntimeError("Не найдена колонка цены 1С. Проверьте вид цены в отчёте.")\n    return m'''
          if anchor not in s:
              raise SystemExit('colmap anchor not found')
          s=s.replace(anchor,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile import_markdown.py
          git diff --check
      - name: Commit patch and clean temp workflow
        shell: bash
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git rm .github/workflows/_tmp-markdown-price-header-v236113.yml
          git add import_markdown.py
          git commit -m 'fix(markdown): accept 1C wholesale VAT price headers v23.6.113'
          git push origin HEAD:main
