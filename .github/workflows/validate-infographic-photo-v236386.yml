name: Validate Triovist source photo (read-only)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-infographic-photo-v236386.yml', 'tools/triovist_infographic_batch.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read_public_card:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'Pillow>=10.2,<12'
      - name: Verify exact SKU 74/1/20 public product photo and public specs
        env:
          SUPABASE_URL: https://example.com
          SUPABASE_KEY: validation_only
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"tools")
          import json,requests
          from triovist_21vek_parser import next_state
          from triovist_infographic_batch import fetch_photo
          url="https://www.21vek.by/concrete_mixers/20_vihr.html"
          r=requests.get(url,timeout=25,headers={"User-Agent":"ResantaCRM-InfographicBatch/1.0 (+https://resanta-crm.by)"})
          print("CARD HTTP",r.status_code,"html bytes",len(r.content))
          state=next_state(r.text)
          fd=(state.get("productCard") or {}).get("fullProductData") or {}
          print("MODEL",fd.get("name"))
          gallery=fd.get("gallery") or []
          print("GALLERY TYPE",type(gallery).__name__,"LEN",len(gallery))
          print("GALLERY SAMPLE",json.dumps(gallery[:3],ensure_ascii=False)[:5000] if isinstance(gallery,list) else json.dumps(gallery,ensure_ascii=False)[:5000])
          item={"sku":"74/1/20","product_name":"Бетономешалка Вихрь БМ-20АЧ (74/1/20)",
                "product_url":"https://www.21vek.by/concrete_mixers/20_vihr.html"}
          image,url,name,facts=fetch_photo(item)
          print("Verified model:",name)
          print("Image dimensions:",image.size)
          print("Original image host:",url.split("/")[2])
          print("Live fact count:",len(facts))
          assert image.width>=450 and image.height>=450
          assert "21vek.by" in url.split("/")[2]
          PY
