name: TEMP publish frontend v23.6.118

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-publish-v236118.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch version references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"const APP_VERSION = '2026-09-14-resanta-crm-v23\.6\.\d+';", "const APP_VERSION = '2026-09-14-resanta-crm-v23.6.118';", s)
          s = re.sub(r'(77-sales-freshness-alert-v23698\.js\?v=)[^\"\']+', r'\g<1>23.6.118', s)
          p.write_text(s, encoding='utf-8')
          Path('data/app-version.json').write_text(json.dumps({
            'version':'23.6.118',
            'released_at':'2026-09-14',
            'purpose':'Triovist: статус обмена 1С встроен в рабочее меню и больше не перекрывается',
            'deploy_trigger':'2026-09-14T11:05:00Z'
          }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          rm .github/workflows/_tmp-publish-v236118.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html data/app-version.json .github/workflows/_tmp-publish-v236118.yml
          git commit -m 'chore: publish frontend v23.6.118'
          git push origin main
