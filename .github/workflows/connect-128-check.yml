name: CONNECT 128 unread and notifications
on:
  pull_request:
    paths:
      - "index.html"
      - "assets/151-resanta-connect-v1.js"
      - "assets/151-resanta-connect-v1.css"
      - "assets/153-resanta-connect-notify-v1.js"
      - "supabase/migrations/20261030080000_connect_128_unread.sql"
      - "tests/connect-128.test.js"
      - ".github/workflows/connect-128-check.yml"
      - ".github/workflows/connect-126-check.yml"
      - ".github/workflows/connect-127-check.yml"
  push:
    branches:
      - "feature/connect-128-unread-notifications"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax checks
        run: |
          node --check assets/151-resanta-connect-v1.js
          node --check assets/153-resanta-connect-notify-v1.js
          node --check tests/connect-128.test.js
      - name: Unread contract checks
        run: node tests/connect-128.test.js
      - name: No legacy CRM files modified
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD > /tmp/connect-128-files
          cat /tmp/connect-128-files
          if grep -Ev '^(index\.html|assets/151-resanta-connect-v1\.(js|css)|assets/153-resanta-connect-notify-v1\.js|supabase/migrations/20261030080000_connect_128_unread\.sql|tests/connect-128\.test\.js|assets/154-resanta-connect-video-v1\.(js|css)|supabase/functions/connect-livekit-token/index\.ts|tests/connect-131\.test\.js|tests/connect-133\.test\.js|\.github/workflows/connect-(126|127|128|131|133)-check\.yml) /tmp/connect-128-files; then
            echo 'Unexpected legacy CRM change' >&2
            exit 1
          fi
 /tmp/connect-128-files; then
            echo 'Unexpected legacy CRM change' >&2
            exit 1
          fi
