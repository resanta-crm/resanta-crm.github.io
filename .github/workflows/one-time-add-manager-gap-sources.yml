name: One-time exact manager gap sources loader

on:
  push:
    paths:
      - '.github/workflows/one-time-add-manager-gap-sources.yml'

permissions:
  contents: write

jobs:
  add-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check module and add exactly one loader line
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/08-manager-gap-sources.js
          BASE="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<script defer src="./assets/07-ai-manager-plans.js?v=23.2.1"></script>'
          line='<script defer src="./assets/08-manager-gap-sources.js?v=23.2.2"></script>'
          if line in s:
              raise SystemExit('08 loader already exists')
          if s.count(anchor)!=1:
              raise SystemExit(f'Expected exactly one 07 loader anchor, found {s.count(anchor)}')
          p.write_text(s.replace(anchor, anchor+'\n'+line), encoding='utf-8')
          PY
          actual="$(git diff --numstat -- index.html)"
          expected=$'1\t0\tindex.html'
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected index diff: $actual"
            git diff -- index.html
            exit 1
          fi
          rm .github/workflows/one-time-add-manager-gap-sources.yml
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-time-add-manager-gap-sources.yml
          git commit -m 'Load manager gap sources module'
          git push origin HEAD:main
