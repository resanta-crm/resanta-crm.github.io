name: Routes Director 360 regression

on:
  pull_request:
    paths:
      - "assets/166-route-director-360-v1.js"
      - "assets/130-route-month-ai-audit-v1.js"
      - "index.html"
      - "tests/route-director-360-v1.test.cjs"
      - ".github/workflows/route-director-360-regression.yml"
  push:
    branches:
      - feature/route-director-360-20261102

permissions:
  contents: read

jobs:
  routes-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check assets/166-route-director-360-v1.js
          node --check assets/130-route-month-ai-audit-v1.js
      - name: Route dashboard regression
        run: node --test tests/route-director-360-v1.test.cjs
