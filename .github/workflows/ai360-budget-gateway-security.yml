name: AI360 isolated verified budget voice gateway
on:
  pull_request:
    paths:
      - 'supabase/functions/crm-ai360-budget-voice-v1/**'
      - 'tests/ai360-budget-gateway-security.test.mjs'
      - '.github/workflows/ai360-budget-gateway-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/crm-ai360-budget-voice-v1/**'
      - 'tests/ai360-budget-gateway-security.test.mjs'
      - '.github/workflows/ai360-budget-gateway-security.yml'
permissions:
  contents: read
jobs:
  verified:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check supabase/functions/crm-ai360-budget-voice-v1/finance.mjs
          node --test tests/ai360-budget-gateway-security.test.mjs
