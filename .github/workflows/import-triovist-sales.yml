name: Триовист — продажи · 6 срезов 1С + почасовая страховка

on:
  push:
    branches: [main]
    paths:
      - 'sync_triovist_sales.py'
      - 'triovist_import_core.py'
      - '.github/workflows/import-triovist-sales.yml'
  schedule:
    # 1С формирует продажи 6 раз в день по Минску:
    # 08:30, 10:30, 12:30, 14:30, 16:30, 18:30.
    # Проверяем чуть позже обычных продаж, чтобы не дёргать Gmail одновременно:
    # 05:45, 07:45, 09:45, 11:45, 13:45, 15:45 UTC.
    - cron: '45 5,7,9,11,13,15 * * *'
    # Почасовая страховка. Без нового письма скрипт ничего не перезаписывает.
    - cron: '27 * * * *'
  workflow_dispatch:

concurrency:
  group: triovist-sales-write
  cancel-in-progress: false

jobs:
  import-triovist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install openpyxl requests

      - name: Обновить и проверить продажи ООО Триовист
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRIOVIST_SALES_LOOKBACK_DAYS: '21'
          TRIOVIST_MAX_EMAIL_CANDIDATES: '20'
        run: python sync_triovist_sales.py
