name: TEMP — Triovist task UX cache v23.6.100
on:
  push:
    paths:
      - '.github/workflows/_tmp-cache-v236100.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump cache and verify
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/2026-09-10-resanta-crm-v23\.6\.99/2026-09-10-resanta-crm-v23.6.100/g" index.html
          sed -i "s#66-performance-root-v23657.js?v=23\.6\.99#66-performance-root-v23657.js?v=23.6.100#g" index.html
          sed -i "s/const V='23\.6\.99'/const V='23.6.100'/" assets/66-performance-root-v23657.js
          node --check assets/62-triovist-task-ux-v23653.js
          node --check assets/66-performance-root-v23657.js
          git diff --check
      - name: Commit production cache bump and remove temp workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-cache-v236100.yml
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git add index.html assets/66-performance-root-v23657.js .github/workflows/_tmp-cache-v236100.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Triovist: refresh task UX cache (v23.6.100)'
          git push
