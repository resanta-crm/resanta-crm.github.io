name: CONNECT 136 server permissions
on:
  pull_request:
    paths:
      - "index.html"
      - "assets/151-resanta-connect-v1.js"
      - "assets/153-resanta-connect-notify-v1.js"
      - "assets/154-resanta-connect-video-v1.js"
      - "tests/connect-133.test.js"
      - "assets/155-resanta-connect-permissions-v1.*"
      - "supabase/migrations/20261030105000_connect_136_permissions.sql"
      - "supabase/functions/connect-livekit-token/index.ts"
      - "tests/connect-136.test.js"
      - ".github/workflows/connect-*-check.yml"
  push:
    branches: ["feature/connect-136-server-permissions"]
permissions:
  contents: read
jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JS syntax, RLS and CRM integration
        run: |
          node --check assets/151-resanta-connect-v1.js
          node --check assets/155-resanta-connect-permissions-v1.js
          node --check tests/connect-136.test.js
          node tests/connect-126.test.js
          node tests/connect-127.test.js
          node tests/connect-128.test.js
          node tests/connect-131.test.js
          node tests/connect-133.test.js
          node tests/connect-136.test.js
      - name: Only CONNECT files touched
        run: |
          git diff --name-only origin/main...HEAD > /tmp/connect136-files
          cat /tmp/connect136-files
          if grep -Ev '^(index\.html|assets/151-resanta-connect-v1\.js|assets/155-resanta-connect-permissions-v1\.(js|css)|supabase/migrations/20261030105000_connect_136_permissions\.sql|supabase/functions/connect-livekit-token/index\.ts|tests/connect-131\.test\.js|tests/connect-136\.test\.js|\.github/workflows/connect-(126|127|128|131|133|136)-check\.yml|assets/153-resanta-connect-notify-v1\.js|assets/154-resanta-connect-video-v1\.js|tests/connect-133\.test\.js)
            echo 'Legacy CRM file modified' >&2
            exit 1
          fi
 /tmp/connect136-files; then
            echo 'Legacy CRM file modified' >&2
            exit 1
          fi
