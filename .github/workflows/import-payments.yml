name: Импорт поступлений денег из 1С

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

# Один Gmail-ящик используется и ПДЗ, и поступлениями. Общая очередь исключает
# одновременные IMAP-сессии и повторение Gmail OVERQUOTA.
concurrency:
  group: finance-imap-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install pandas openpyxl requests

      - name: Импортировать поступления менеджеров
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAYMENTS_SUBJECT_MARKER: 'Поступление денег для CRM'
          PAYMENTS_LOOKBACK_DAYS: '30'
          PAYMENTS_HEADER_BATCH_SIZE: '100'
          PAYMENTS_HEADER_SCAN_LIMIT: '5000'
          PAYMENTS_MAX_CANDIDATE_EMAILS: '12'
          PAYMENTS_FILENAME_FALLBACK_EMAILS: '12'
        run: python import_payments.py
