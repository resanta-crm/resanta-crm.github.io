name: Импорт поступлений денег из 1С

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install pandas openpyxl requests

      - name: Импортировать поступления менеджеров
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAYMENTS_SUBJECT_MARKER: 'Поступление денег для CRM'
          PAYMENTS_LOOKBACK_DAYS: '10'
        run: python import_payments.py
