name: AI360 v4.1 context and truth
on:
  pull_request:
    paths:
      - 'supabase/functions/crm-ai360-dialog-v4/**'
      - 'supabase/migrations/*ai360_v41*'
      - 'assets/143-resanta-ai360-unified-dialog-v1.js'
      - 'tests/ai360-v41-context-truth.test.mjs'
      - '.github/workflows/ai360-v41.yml'
  push:
    branches: [feature/ai360-context-truth-v41-20261028]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and safety checks
        run: |
          node --check supabase/functions/crm-ai360-dialog-v4/core.mjs
          node --check supabase/functions/crm-ai360-dialog-v4/context.mjs
          node --check assets/143-resanta-ai360-unified-dialog-v1.js
      - name: Existing and new regression
        run: |
          node --test tests/ai360-v41-context-truth.test.mjs
          node --test tests/ai360-core-v4-smoke.test.mjs
          node tests/ai360-universal-browser-20261027.test.cjs
          node tests/ai360-conversation-debt-20261028.test.mjs
