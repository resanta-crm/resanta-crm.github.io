name: AI360 v4.2 date and customer analytics
on:
  push:
    branches: [feature/ai360-dates-client-groups-routes-v42-20261029]
  pull_request:
    paths:
      - 'supabase/functions/crm-ai360-dialog-v4/**'
      - 'supabase/migrations/*ai360_client_groups_schedule_v42.sql'
      - 'tests/ai360-v42-dates-client-groups.test.mjs'
      - '.github/workflows/ai360-v42.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and analytical guardrails
        run: |
          node --check supabase/functions/crm-ai360-dialog-v4/core.mjs
          node --check supabase/functions/crm-ai360-dialog-v4/context.mjs
          node --check supabase/functions/crm-ai360-dialog-v4/dates.mjs
          node --check supabase/functions/crm-ai360-dialog-v4/client-identity.mjs
          node --test tests/ai360-v42-dates-client-groups.test.mjs
      - name: Run existing voice and scoped fact regressions
        run: |
          node --test tests/ai360-v41-context-truth.test.mjs
          node --test tests/ai360-core-v4-smoke.test.mjs
          node tests/ai360-universal-browser-20261027.test.cjs
          node tests/ai360-conversation-debt-20261028.test.mjs
