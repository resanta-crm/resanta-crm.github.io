name: One-time Triovist AI v23.4.6 final

on:
  push:
    paths:
      - '.github/workflows/one-time-triovist-ai-v2346-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v23.4.6 final module and root
        shell: python
        run: |
          from pathlib import Path

          src = Path('assets/11-triovist-ai-plans-v2345.js')
          dst = Path('assets/11-triovist-ai-plans-v2346.js')
          s = src.read_text(encoding='utf-8')
          s = s.replace('v23.4.5', 'v23.4.6').replace('2345', '2346')
          s = s.replace('oninput="triovistAiDraftPlanV2346', 'onchange="triovistAiDraftPlanV2346')
          dst.write_text(s, encoding='utf-8')

          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          replacements = [
              ("const APP_VERSION = '2026-08-18-resanta-crm-v23.4.5';", "const APP_VERSION = '2026-08-18-resanta-crm-v23.4.6';"),
              ('./assets/09-manager-kpi-save-fix.js?v=23.4.5', './assets/09-manager-kpi-save-fix.js?v=23.4.6'),
              ('./assets/11-triovist-ai-plans-v2345.js?v=23.4.5', './assets/11-triovist-ai-plans-v2346.js?v=23.4.6'),
          ]
          for old, new in replacements:
              if old not in h:
                  raise SystemExit(f'Expected root marker not found: {old}')
              h = h.replace(old, new, 1)
          p.write_text(h, encoding='utf-8')

      - name: Remove obsolete module and one-time installer
        run: |
          rm -f assets/11-triovist-ai-plans-v2345.js
          rm -f .github/workflows/one-time-triovist-ai-v2346-final.yml
          git config user.name "resanta-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/11-triovist-ai-plans-v2345.js assets/11-triovist-ai-plans-v2346.js .github/workflows/one-time-triovist-ai-v2346-final.yml
          git commit -m "Finalize Triovist AI plans v23.4.6"
          git push

