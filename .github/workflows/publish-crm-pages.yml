name: Publish Resanta CRM Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - CNAME
      - robots.txt
      - manifest.json
      - service-worker.js
      - assets/**
      - data/**
      - icons/**
      - .github/workflows/publish-crm-pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Production publications must finish normally. A newer commit may wait,
# but it must not interrupt a Pages deployment that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Prepare and deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare clean site artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          test -s index.html
          cp index.html _site/index.html

          for file in CNAME robots.txt manifest.json service-worker.js; do
            if [ -f "$file" ]; then
              cp "$file" "_site/$file"
            fi
          done

          for dir in assets data icons; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done

          touch _site/.nojekyll

          echo "Prepared Pages artifact:"
          find _site -maxdepth 3 -type f -print | sort

      - name: Validate packaged Triovist seasonality profile
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/data/triovist_seasonality.json
          python - <<'PY'
          import json
          path = '_site/data/triovist_seasonality.json'
          with open(path, encoding='utf-8') as f:
              profile = json.load(f)
          assert profile.get('version') == 'v23.5.0', profile.get('version')
          levels = profile.get('levels') or {}
          assert levels.get('sku'), 'seasonality SKU level is empty'
          assert levels.get('subgroup'), 'seasonality subgroup level is empty'
          assert levels.get('category'), 'seasonality category level is empty'
          print('Triovist seasonality profile ready for Pages:', profile.get('version'), profile.get('history_from'), profile.get('history_to'))
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public seasonality URL and record health marker
        shell: bash
        run: |
          set -euo pipefail
          URL='https://resanta-crm.by/data/triovist_seasonality.json?v=23.5.0'
          OK=0
          for attempt in $(seq 1 18); do
            echo "Public profile check $attempt/18"
            if curl -fsSL --connect-timeout 10 --max-time 30 "$URL" -o /tmp/triovist_seasonality.json; then
              if python - <<'PY'
          import json
          with open('/tmp/triovist_seasonality.json', encoding='utf-8') as f:
              p = json.load(f)
          assert p.get('version') == 'v23.5.0', p.get('version')
          levels = p.get('levels') or {}
          assert levels.get('sku') and levels.get('subgroup') and levels.get('category')
          print('Public profile verified:', p.get('version'), p.get('history_from'), p.get('history_to'))
          PY
              then
                OK=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$OK" != '1' ]; then
            echo '::error::Public Triovist seasonality profile is still unavailable or invalid after deploy'
            exit 1
          fi
          python - <<'PY'
          import json, datetime, os
          p=json.load(open('/tmp/triovist_seasonality.json',encoding='utf-8'))
          out={
            'status':'ok',
            'version':p.get('version'),
            'history_from':p.get('history_from'),
            'history_to':p.get('history_to'),
            'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'source_sha':os.environ.get('GITHUB_SHA'),
            'url':'https://resanta-crm.by/data/triovist_seasonality.json?v=23.5.0'
          }
          open('.github/triovist-seasonality-public-status.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/triovist-seasonality-public-status.json
          git commit -m 'Verify public Triovist seasonality profile [skip ci]' || exit 0
          git push
