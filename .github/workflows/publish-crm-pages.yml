name: Publish Resanta CRM Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - CNAME
      - robots.txt
      - manifest.json
      - service-worker.js
      - inventory.html
      - inventory-manifest.webmanifest
      - inventory-sw.js
      - inventory-icon.svg
      - inventory-qr.svg
      - assets/**
      - data/**
      - icons/**
      - .github/workflows/publish-crm-pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Production publications must finish normally. A newer commit may wait,
# but it must not interrupt a Pages deployment that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Prepare and deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare clean site artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          test -s index.html
          cp index.html _site/index.html

          for file in CNAME robots.txt manifest.json service-worker.js inventory.html inventory-manifest.webmanifest inventory-sw.js inventory-icon.svg inventory-qr.svg; do
            if [ -f "$file" ]; then
              cp "$file" "_site/$file"
            fi
          done

          # Публично выкладываем только код/иконки.
          # data/ больше НИКОГДА не копируется целиком: там могут быть рабочие выгрузки.
          for dir in assets icons; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done

          # Жёсткий allowlist публичных data-файлов.
          mkdir -p _site/data
          for file in app-version.json; do
            if [ -f "data/$file" ]; then
              cp "data/$file" "_site/data/$file"
            fi
          done

          # Аварийная защита: коммерческие выгрузки не должны попасть в Pages
          # даже если кто-то случайно добавит их в data/ позже.
          if find _site -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.csv' -o -iname '*.sql' -o -iname '*.zip' \) -print -quit | grep -q .; then
            echo '::error::Sensitive export file detected in public Pages artifact'
            find _site -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.csv' -o -iname '*.sql' -o -iname '*.zip' \) -print
            exit 1
          fi

          touch _site/.nojekyll

          echo "Prepared Pages artifact:"
          find _site -maxdepth 3 -type f -print | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
