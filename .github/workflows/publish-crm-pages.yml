name: Publish Resanta CRM Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - CNAME
      - robots.txt
      - manifest.json
      - service-worker.js
      - assets/**
      - data/**
      - icons/**
      - .github/workflows/publish-crm-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Production publications must finish normally. A newer commit may wait,
# but it must not interrupt a Pages deployment that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Prepare and deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare clean site artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          test -s index.html
          cp index.html _site/index.html

          for file in CNAME robots.txt manifest.json service-worker.js; do
            if [ -f "$file" ]; then
              cp "$file" "_site/$file"
            fi
          done

          for dir in assets data icons; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done

          touch _site/.nojekyll

          echo "Prepared Pages artifact:"
          find _site -maxdepth 3 -type f -print | sort

      - name: Validate published Triovist seasonality profile
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/data/triovist_seasonality.json
          python - <<'PY'
          import json
          path = '_site/data/triovist_seasonality.json'
          with open(path, encoding='utf-8') as f:
              profile = json.load(f)
          assert profile.get('version') == 'v23.5.0', profile.get('version')
          levels = profile.get('levels') or {}
          assert levels.get('sku'), 'seasonality SKU level is empty'
          assert levels.get('subgroup'), 'seasonality subgroup level is empty'
          assert levels.get('category'), 'seasonality category level is empty'
          print('Triovist seasonality profile ready for Pages:', profile.get('version'), profile.get('history_from'), profile.get('history_to'))
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
