name: TEMP Markdown price UI 23.6.114

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_tmp-markdown-price-ui-v236114.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_markdown_price_ui_v236114.py
      - name: Commit result
        run: |
          rm -f .github/workflows/_tmp-markdown-price-ui-v236114.yml
          rm -f patch_markdown_price_ui_v236114.py
          git config user.name resanta-crm
          git config user.email resantavitebsc@gmail.com
          git add -A
          git commit -m "fix(markdown): sync discount and rename price basis v23.6.114"
          git push
