name: Триовист — первичная полная история

on:
  workflow_dispatch:

concurrency:
  group: triovist-sales-write
  cancel-in-progress: false

jobs:
  import-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install openpyxl requests

      - name: Проверить наличие файла истории
        run: test -f data/triovist_history_2023-02_to_2026-07.xlsx && ls -lh data/triovist_history_2023-02_to_2026-07.xlsx

      - name: Загрузить и сверить всю историю Триовиста
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python import_triovist_history.py data/triovist_history_2023-02_to_2026-07.xlsx
