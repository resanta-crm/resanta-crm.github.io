name: Publish Triovist manager parser alert v23.6.108

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-triovist-manager-alert-v236108.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump frontend version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("2026-09-11-resanta-crm-v23.6.107", "2026-09-11-resanta-crm-v23.6.108")
          s = s.replace("./assets/66-performance-root-v23657.js?v=23.6.107", "./assets/66-performance-root-v23657.js?v=23.6.108")
          p.write_text(s, encoding='utf-8')

          p = Path('assets/66-performance-root-v23657.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const V='23.6.107'", "const V='23.6.108'")
          p.write_text(s, encoding='utf-8')

          Path('data/app-version.json').write_text(json.dumps({
              'version': '23.6.108',
              'released_at': '2026-09-11',
              'purpose': 'Triovist 21vek manager warning: prominent amber/red parser failure highlighting',
              'deploy_trigger': '2026-09-11T13:20:00Z'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "resanta-crm"
          git config user.email "resantavitebsc@gmail.com"
          git rm .github/workflows/publish-triovist-manager-alert-v236108.yml
          git add index.html assets/66-performance-root-v23657.js data/app-version.json
          git commit -m "Triovist: manager parser failure alert v23.6.108"
          git push
