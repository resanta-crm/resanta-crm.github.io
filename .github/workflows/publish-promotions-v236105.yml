name: Publish promotion fixes v23.6.105

on:
  push:
    paths:
      - '.github/workflows/publish-promotions-v236105.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v23.6.105 cache/version patch
        run: python publish_promotions_v236105.py
      - name: Commit published version
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: publish frontend v23.6.105'
          git push
