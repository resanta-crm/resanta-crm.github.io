name: Deploy Resanta CRM Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'CNAME'
      - 'robots.txt'
      - '.nojekyll'
      - '*.js'
      - '*.css'
      - '*.json'
      - '*.webmanifest'
      - '*.ico'
      - 'assets/**'
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один Pages-deploy одновременно. При новом обновлении старый незавершённый
# запуск отменяется, поэтому свежая версия не стоит за ним в очереди.
concurrency:
  group: resanta-crm-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish CRM
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare minimal site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          [ ! -f CNAME ] || cp CNAME _site/CNAME
          [ ! -f robots.txt ] || cp robots.txt _site/robots.txt
          touch _site/.nojekyll

          # Резерв на будущее разделение большого index.html на модули.
          for file in ./*.js ./*.css ./*.json ./*.webmanifest ./*.ico; do
            [ ! -f "$file" ] || cp "$file" _site/
          done
          for dir in assets js css icons; do
            [ ! -d "$dir" ] || cp -R "$dir" _site/
          done

          echo 'Pages artifact:'
          find _site -type f -printf '%P  %s bytes\n' | sort
          test -s _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          reporting_interval: 3000
