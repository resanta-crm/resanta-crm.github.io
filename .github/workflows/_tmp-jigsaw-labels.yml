name: TMP — inspect jigsaw labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-jigsaw-labels.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Dump jigsaw labels
        run: |
          python - <<'PY'
          import requests, json, re, sys
          sys.path.insert(0,'tools')
          from triovist_21vek_parser import next_state
          url='https://www.21vek.by/fretsaws/lxjs6507e1334588_wortex_9189959.html'
          h={'User-Agent':'ResantaCRM-21vekMarket/1.0 (+https://resanta-crm.by)','Accept-Language':'ru-RU,ru;q=0.9'}
          html=requests.get(url,headers=h,timeout=30).text
          state=next_state(html)
          root=(state.get('productCard') or {}).get('fullProductData') or {}
          label_keys=('name','title','label','caption','propertyName','featureName','characteristicName','parameterName')
          value_keys=('value','text','displayValue','propertyValue','featureValue','characteristicValue','parameterValue')
          rows=[]
          def walk(node,path='fd'):
              if isinstance(node,dict):
                  label=None
                  for lk in label_keys:
                      if isinstance(node.get(lk),(str,int,float)):
                          label=str(node.get(lk));break
                  if label is not None:
                      for vk in value_keys:
                          if vk in node and isinstance(node.get(vk),(str,int,float,bool)):
                              val=str(node.get(vk))
                              if any(x in (label+' '+val).lower() for x in ('ход','пропил','рез','частот','мощност','двигател','питан')):
                                  rows.append((path,label,val))
                  for k,v in node.items():
                      if isinstance(v,(dict,list)): walk(v,path+'.'+str(k))
              elif isinstance(node,list):
                  for i,v in enumerate(node): walk(v,f'{path}[{i}]')
          walk(root)
          for row in rows:
              print(' | '.join(row))
          PY
