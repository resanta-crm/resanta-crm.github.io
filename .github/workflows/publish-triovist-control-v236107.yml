name: Publish Triovist control v23.6.107

on:
  push:
    branches: [main]
    paths:
      - 'publish_triovist_control_v236107.py'
      - '.github/workflows/publish-triovist-control-v236107.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch frontend
        run: python publish_triovist_control_v236107.py
      - name: Commit frontend v23.6.107
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'chore: publish frontend v23.6.107'
          git push
