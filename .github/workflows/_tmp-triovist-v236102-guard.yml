name: TEMP — Triovist runtime guard v23.6.102

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_tmp-triovist-v236102-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore task loader and bump cache
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/03-triovist-routes.js')
          s=p.read_text(encoding='utf-8')
          bad="rpc('triovist_tasks_get_dashboard_month_v23648',{p_manager_email:null,p_month:month+'-01'},60000),"
          if s.count(bad)!=2: raise SystemExit(f'expected 2 monthly calls, got {s.count(bad)}')
          original="window.TRIOVIST_DATA_HUB_V227315.tasks({p_manager_email:null}),"
          s=s.replace(bad,original,1)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/11-triovist-ai-plans-v2348.js')
          s=p.read_text(encoding='utf-8').replace('RESANTA CRM v23.6.101 · TRIOVIST AI PLANS','RESANTA CRM v23.6.102 · TRIOVIST AI PLANS',1).replace("const V='v23.6.101';","const V='v23.6.102';",1)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/66-performance-root-v23657.js')
          s=p.read_text(encoding='utf-8')
          if "const V='23.6.101',flights" not in s: raise SystemExit('performance root v101 not found')
          s=s.replace("const V='23.6.101',flights","const V='23.6.102',flights",1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("resanta-crm-v23.6.101","resanta-crm-v23.6.102",1)
          if s.count('03-triovist-routes.js?v=23.6.101')!=2: raise SystemExit('03 v101 refs mismatch')
          s=s.replace('03-triovist-routes.js?v=23.6.101','03-triovist-routes.js?v=23.6.102')
          s=s.replace('66-performance-root-v23657.js?v=23.6.101','66-performance-root-v23657.js?v=23.6.102',1)
          p.write_text(s,encoding='utf-8')

          s3=Path('assets/03-triovist-routes.js').read_text(encoding='utf-8')
          if s3.count("rpc('triovist_tasks_get_dashboard_month_v23648',{p_manager_email:null,p_month:month+'-01'},60000),")!=1: raise SystemExit('motivation monthly RPC guard failed')
          if s3.count(original)<1: raise SystemExit('main task DataHub loader not restored')
          print('runtime guard passed')
          PY
          node --check assets/03-triovist-routes.js
          node --check assets/11-triovist-ai-plans-v2348.js
          node --check assets/66-performance-root-v23657.js
          git diff --check
      - name: Commit and clean up
        run: |
          set -euo pipefail
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/03-triovist-routes.js assets/11-triovist-ai-plans-v2348.js assets/66-performance-root-v23657.js index.html
          git rm .github/workflows/_tmp-triovist-v236102-guard.yml
          git commit -m 'Triovist: guard task loader and finalize KPI gap fix (v23.6.102)'
          git pull --rebase origin main
          git push origin main
