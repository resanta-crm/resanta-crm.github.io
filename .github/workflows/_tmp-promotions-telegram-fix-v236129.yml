name: TMP — Promotions Telegram fix v23.6.129

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-promotions-telegram-fix-v236129.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wire Telegram fix and bump frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changes=[
            ("const APP_VERSION = '2026-09-16-resanta-crm-v23.6.128';", "const APP_VERSION = '2026-09-16-resanta-crm-v23.6.129';"),
            ('<script defer src="./assets/66-performance-root-v23657.js?v=23.6.128"></script>', '<script defer src="./assets/66-performance-root-v23657.js?v=23.6.129"></script>'),
          ]
          for old,new in changes:
              if s.count(old)!=1: raise SystemExit(f'index guard failed: {old} matches={s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/72-promotions-stable-render-v23671.js')
          s=p.read_text(encoding='utf-8')
          old="s.src='./assets/87-promotions-telegram-connect-v236128.js?v=23.6.128';"
          new="s.src='./assets/87-promotions-telegram-connect-v236128.js?v=23.6.129';"
          if s.count(old)!=1: raise SystemExit(f'loader guard failed: matches={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git add index.html assets/72-promotions-stable-render-v23671.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Telegram connect CORS flow v23.6.129'
          git push
