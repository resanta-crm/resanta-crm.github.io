name: One-shot Triovist stale frontend recovery v23.6.103

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_tmp-triovist-v236103-frontend-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale AI bundle recovery and frontend version check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          ai = 'assets/11-triovist-ai-plans-v2348.js'
          replace_once(ai,
              '/* RESANTA CRM v23.6.102 · TRIOVIST AI PLANS · sell-out + replenishment gap truth */',
              '/* RESANTA CRM v23.6.103 · TRIOVIST AI PLANS · stale-runtime-safe sell-out + replenishment gap truth */')
          replace_once(ai,
              "(function(){\n'use strict';\nif(window.RESANTA_TRIOVIST_AI_PLANS_V2348)return;\n\nconst V='v23.6.102';",
              "(function(){\n'use strict';\nconst V='v23.6.103';\nconst previousModule=window.RESANTA_TRIOVIST_AI_PLANS_V2348;\nif(previousModule&&String(previousModule.version||'')===V)return;\n// A page may stay open across a deploy. An older v23.4.8 module used the same guard,\n// so a boolean guard alone can pin the old UI forever. Release the stale guard and\n// let this bundle take over; the wrapper below is version-aware as well.\nif(previousModule){try{window.RESANTA_TRIOVIST_AI_PLANS_V2348=null}catch(_){}}")
          replace_once(ai,
              "if(typeof baseRender==='function'&&!baseRender.__ai2348){const w=function(){const out=baseRender.apply(this,arguments);lastSig='';schedule(0);startProbe();return out};w.__ai2348=true;window.renderTriovist=w;try{renderTriovist=w}catch(_){}}",
              "if(typeof baseRender==='function'&&baseRender.__ai2348Version!==V){const w=function(){const out=baseRender.apply(this,arguments);lastSig='';schedule(0);startProbe();return out};w.__ai2348=true;w.__ai2348Version=V;window.renderTriovist=w;try{renderTriovist=w}catch(_){}}")
          replace_once(ai,
              "if(typeof baseReload==='function'&&!baseReload.__ai2348){const w=async function(){const out=await baseReload.apply(this,arguments);lastSig='';schedule(0);startProbe();return out};w.__ai2348=true;window.triovistReload=w;try{triovistReload=w}catch(_){}}",
              "if(typeof baseReload==='function'&&baseReload.__ai2348Version!==V){const w=async function(){const out=await baseReload.apply(this,arguments);lastSig='';schedule(0);startProbe();return out};w.__ai2348=true;w.__ai2348Version=V;window.triovistReload=w;try{triovistReload=w}catch(_){}}")

          root = 'assets/66-performance-root-v23657.js'
          replace_once(root,
              "const V='23.6.102',flights=new Map(),contractFlights=new Map();",
              "const V='23.6.103',flights=new Map(),contractFlights=new Map();\nconst VERSIONED_GUARDS=Object.freeze({RESANTA_TRIOVIST_AI_PLANS_V2348:'v23.6.103'});")
          replace_once(root,
              "function loaded(guard){return !!(guard&&window[guard])}",
              "function loaded(guard){\n  if(!(guard&&window[guard]))return false;\n  const expected=VERSIONED_GUARDS[guard];\n  return !expected||String(window[guard]?.version||'')===expected;\n}")

          watcher = r'''let lastFrontendVersionCheck=0,frontendReloading=false;
          async function checkFrontendVersion(force=false){
            if(frontendReloading)return false;
            const now=Date.now();
            if(!force&&now-lastFrontendVersionCheck<60000)return false;
            lastFrontendVersionCheck=now;
            try{
              const r=await fetch('./data/app-version.json?ts='+now,{cache:'no-store'});
              if(!r.ok)return false;
              const j=await r.json(),remote=String(j?.version||'').replace(/^v/,'');
              if(remote&&remote!==V){
                frontendReloading=true;
                const b=document.getElementById('crm-update-banner');
                if(b){b.textContent='CRM обновлена. Загружаем новую версию…';b.classList.add('show')}
                setTimeout(()=>location.reload(),250);
                return true;
              }
            }catch(_){}
            return false;
          }
          window.crmCheckFrontendVersionV236103=checkFrontendVersion;
          window.addEventListener('focus',()=>checkFrontendVersion(false),{passive:true});
          document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkFrontendVersion(false)},{passive:true});
          '''
          replace_once(root, 'function boot(){', watcher + '\nfunction boot(){')
          replace_once(root,
              "async function loadForPage(page,epoch){\n  const p=String(page||activePage()||'');",
              "async function loadForPage(page,epoch){\n  checkFrontendVersion(false).catch(()=>{});\n  const p=String(page||activePage()||'');")

          index = 'index.html'
          replace_once(index,
              "const APP_VERSION = '2026-09-10-resanta-crm-v23.6.102';",
              "const APP_VERSION = '2026-09-10-resanta-crm-v23.6.103';")
          replace_once(index,
              '<script defer src="./assets/66-performance-root-v23657.js?v=23.6.102"></script>',
              '<script defer src="./assets/66-performance-root-v23657.js?v=23.6.103"></script>')

          Path('data/app-version.json').write_text(json.dumps({
              'version':'23.6.103',
              'released_at':'2026-09-10',
              'purpose':'frontend cache/runtime invalidation'
          }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Validate JavaScript and patch invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/11-triovist-ai-plans-v2348.js
          node --check assets/66-performance-root-v23657.js
          grep -q "const V='v23.6.103'" assets/11-triovist-ai-plans-v2348.js
          grep -q "RESANTA_TRIOVIST_AI_PLANS_V2348:'v23.6.103'" assets/66-performance-root-v23657.js
          grep -q "crmCheckFrontendVersionV236103" assets/66-performance-root-v23657.js
          grep -q "resanta-crm-v23.6.103" index.html
          grep -q '"version": "23.6.103"' data/app-version.json

      - name: Commit final patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/_tmp-triovist-v236103-frontend-refresh.yml
          git add assets/11-triovist-ai-plans-v2348.js assets/66-performance-root-v23657.js index.html data/app-version.json
          git commit -m 'Triovist: recover stale AI frontend and auto-refresh versions (v23.6.103)'
          git push
