name: Triovist 21vek Uni AI listing preservation
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/106-triovist-competitors-v236218.js'
      - 'assets/100-safe-upgrades-loader-v236272.js'
      - 'index.html'
      - 'tests/triovist-competitors-uni-cache.test.mjs'
      - 'tests/triovist-competitors-uni-listing.test.mjs'
      - '.github/workflows/triovist-competitors-uni-listing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse competition UI without modifying parser
        run: |
          node --check assets/106-triovist-competitors-v236218.js
          node --check assets/100-safe-upgrades-loader-v236272.js
          node --check assets/173-triovist-native-sections-v1.js
      - name: Check classic listing, filters and Uni AI
        run: |
          node --test tests/triovist-competitors-uni-listing.test.mjs tests/triovist-competitors-uni-cache.test.mjs tests/triovist-native-sections-v1.test.mjs
      - name: Guard existing 21vek cards, parser and migrations
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD > /tmp/trio-diff
          cat /tmp/trio-diff
          ! grep -E '(^assets/(80-triovist-21vek-control-v236107|173-triovist-native-sections-v1)[.]js$|^tools/|^assets/.*card.*21vek)' /tmp/trio-diff
          # Reviewed client metadata/RPC migrations and Lera screen reader; Triovist parser/cards remain protected.
          ! (grep '^supabase/' /tmp/trio-diff | grep -v -Fx -e 'supabase/migrations/20261105_triovist_ai_demand_preview_v1.sql' -e 'supabase/migrations/20261105_triovist_ai_task_draft_v1.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_subgroups_preview_v2.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_approve_v2.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_verify_v2.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_manual_target_fix_v3.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_listing_provenance_v3.sql' -e 'supabase/migrations/20261105_gps_director360_evidence_v1.sql' -e 'supabase/migrations/20261105_gps_director360_stop_reviews_v1.sql' -e 'supabase/migrations/20261105_gps_director360_live_stops_v1.sql' -e 'supabase/migrations/20261106_gps360_safe_history_v1.sql' -e 'supabase/migrations/20261106_gps360_store_onsite_v1.sql' -e 'supabase/migrations/20261106_gps360_probable_stops_v1.sql' -e 'supabase/migrations/20261106_gps360_evidence_completed_v2.sql' -e 'supabase/migrations/20261106142000_gps360_exact_physical_store_read_v1.sql' -e 'supabase/migrations/20261106143500_gps360_vip_new_clients_guard_v1.sql' -e 'supabase/migrations/20261109_triovist_search360_isolated_v1.sql' -e 'supabase/migrations/20261109_triovist_search360_negative_coverage_v2.sql' -e 'supabase/migrations/20261109_triovist_decisions360_task_facts_v1.sql' -e 'supabase/migrations/20261109_triovist_decisions360_category_evidence_v1.sql' -e 'supabase/migrations/20261109_warehouse_vitebsk360_truth_v1.sql' -e 'supabase/migrations/20261109_warehouse_vitebsk360_order_approval_v1.sql' -e 'supabase/migrations/20261109_warehouse_vitebsk360_approved_document_v1.sql' -e 'supabase/migrations/20261109_gps360_director_decisions_recheck_v1.sql' -e 'supabase/migrations/20261111134000_triovist_market_ai_investigations_v1.sql' -e 'supabase/functions/triovist-market-investigate-v1/index.ts' -e 'supabase/functions/crm-ai360-agent-v1/control-center.mj