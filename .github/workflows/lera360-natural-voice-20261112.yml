name: Lera 360 natural voice - Mac regression
on:
  pull_request:
    paths:
      - 'assets/135-resanta-voice-capture-fix-v2.js'
      - 'assets/136-resanta-voice-quality-v3.js'
      - 'assets/137-resanta-ai360-lazy-launch-v1.js'
      - 'assets/144-resanta-ai360-branch-voice-v1.js'
      - 'assets/146-resanta-ai360-branch-premium-voice-v1.js'
      - 'assets/147-resanta-ai360-staff-unified-dialog-v1.js'
      - 'assets/157-resanta-ai360-android-staff-launch-v1.js'
      - 'assets/218-lera360-speech-accents-v1.js'
      - 'index.html'
      - 'tests/lera360-natural-voice-v1.test.mjs'
      - '.github/workflows/lera360-natural-voice-20261112.yml'
  push:
    branches: [main]
    paths:
      - 'assets/218-lera360-speech-accents-v1.js'
      - 'assets/146-resanta-ai360-branch-premium-voice-v1.js'
      - 'tests/lera360-natural-voice-v1.test.mjs'
permissions: { contents: read }
jobs:
  natural-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for file in assets/135-resanta-voice-capture-fix-v2.js assets/136-resanta-voice-quality-v3.js assets/137-resanta-ai360-lazy-launch-v1.js assets/144-resanta-ai360-branch-voice-v1.js assets/146-resanta-ai360-branch-premium-voice-v1.js assets/147-resanta-ai360-staff-unified-dialog-v1.js assets/157-resanta-ai360-android-staff-launch-v1.js assets/218-lera360-speech-accents-v1.js; do node --check "$file"; done
      - name: Wake/turn-taking/voice and old-access regression
        run: |
          node --test tests/lera360-natural-voice-v1.test.mjs
          node --test tests/ai360-remembered-wake-session.test.cjs
          node --test tests/ai360-voice-full-answer.test.cjs
          node --test tests/ai360-field-manager-shared-voice.test.mjs
          node --test tests/ai360-branch-premium-parity.test.mjs
          node --test tests/ai360-manager-voice-dialogue.test.cjs
