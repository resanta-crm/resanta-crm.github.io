name: TMP — fix Акции MO2 v23.6.124

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-fix-promotions-mo2-v236124.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-fix-promotions-mo2-v236124
  cancel-in-progress: true

jobs:
  patch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch index with strict guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changes=[
            ("const APP_VERSION = '2026-09-16-resanta-crm-v23.6.123';", "const APP_VERSION = '2026-09-16-resanta-crm-v23.6.124';"),
            ('<script defer src="./assets/66-performance-root-v23657.js?v=23.6.122"></script>', '<script defer src="./assets/66-performance-root-v23657.js?v=23.6.124"></script>'),
            ('<script defer src="./assets/68-vip-actions-nav-v23659.js?v=23.6.123"></script>', '<script defer src="./assets/68-vip-actions-nav-v23659.js?v=23.6.124"></script>'),
          ]
          for old,new in changes:
              if s.count(old)!=1:
                  raise SystemExit(f'Guard failed: {old} matches={s.count(old)}')
              s=s.replace(old,new,1)
          duplicate='<script defer src="./assets/80-promotion-mo2-v236123.js?v=23.6.123.1"></script>\n'
          if s.count(duplicate)!=1:
              raise SystemExit(f'Guard failed: duplicate MO2 script matches={s.count(duplicate)}')
          s=s.replace(duplicate,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Акции module loading v23.6.124'
          git push
