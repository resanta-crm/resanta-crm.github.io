name: TEMP 21vek adaptive v0.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-21vek-adaptive-v08.yml'
      - 'tools/_tmp_21vek_adaptive_v08.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply adaptive limiter
        run: python tools/_tmp_21vek_adaptive_v08.py
      - name: Validate parser
        run: |
          python -m py_compile tools/triovist_21vek_shadow_sync.py
          grep -q 'PARSER_VERSION="shadow-v0.8"' tools/triovist_21vek_shadow_sync.py
      - name: Commit parser
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git add tools/triovist_21vek_shadow_sync.py
          git commit -m 'perf(21vek): add adaptive throttle limiter v0.8'
          git push
