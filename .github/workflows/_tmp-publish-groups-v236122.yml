name: TEMP publish Triovist groups v23.6.122
on:
  push:
    paths:
      - '.github/workflows/_tmp-publish-groups-v236122.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch frontend version
        run: python tools/publish_groups_v236122.py
      - name: Validate JavaScript
        run: |
          node --check assets/84-triovist-group-dynamics-refresh-v236122.js
          node --check assets/83-triovist-group-dynamics-fixes-v236121.js
          node --check assets/34-triovist-root-v23614.js
          node --check assets/66-performance-root-v23657.js
      - name: Commit
        run: |
          rm -f .github/workflows/_tmp-publish-groups-v236122.yml tools/publish_groups_v236122.py
          git config user.name resanta-crm
          git config user.email resantavitebsc@gmail.com
          git add -A
          git commit -m 'chore: publish frontend v23.6.122' || exit 0
          git push
