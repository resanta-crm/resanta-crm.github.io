name: Triovist — 21vek listing delivery research

on:
  push:
    branches:
      - triovist-21vek-parser-prototype
    paths:
      - 'tools/triovist_21vek_listing_delivery_probe.py'
      - 'data/triovist_21vek_listing_delivery_probe.json'
      - '.github/workflows/triovist-21vek-listing-delivery-research.yml'
  workflow_dispatch:

concurrency:
  group: triovist-21vek-listing-delivery-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Probe public product and category pages
        run: python tools/triovist_21vek_listing_delivery_probe.py data/triovist_21vek_listing_delivery_probe.json 21vek-listing-delivery-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: triovist-21vek-listing-delivery-result
          path: 21vek-listing-delivery-result.json
          retention-days: 3
