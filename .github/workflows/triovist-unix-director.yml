name: Triovist Uni X Director single workspace
on:
  pull_request:
    paths:
      - "assets/171-triovist-unix-director-v1.js"
      - "assets/34-triovist-root-v23614.js"
      - "assets/173-triovist-native-sections-v1.js"
      - "assets/174-triovist-stock-director-v1.js"
      - "assets/03-triovist-routes.js"
      - "tests/triovist-stock-director-v1.test.mjs"
      - "assets/82-triovist-group-dynamics-v236120.js"
      - "assets/104-safe-triovist-v236200.js"
      - "assets/175-triovist-motivation-director-v1.js"
      - "tests/triovist-motivation-director-v1.test.mjs"
      - "assets/100-safe-upgrades-loader-v236272.js"
      - "tests/triovist-native-sections-v1.test.mjs"
      - "tests/triovist-groups-single-screen-v1.test.mjs tests/triovist-stock-director-v1.test.mjs"
      - "index.html"
      - "tests/triovist-unix-director-v1.test.mjs"
      - ".github/workflows/triovist-unix-director.yml"
  push:
    branches:
      - feat/triovist-unix-director-single-workspace-20261104
permissions:
  contents: read
jobs:
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate new and existing browser modules
        run: |
          node --check assets/171-triovist-unix-director-v1.js
          node --check assets/34-triovist-root-v23614.js
          node --check assets/173-triovist-native-sections-v1.js
          node --check assets/174-triovist-stock-director-v1.js
          node --check assets/03-triovist-routes.js
          node --check assets/82-triovist-group-dynamics-v236120.js
          node --check assets/104-safe-triovist-v236200.js
          node --check assets/175-triovist-motivation-director-v1.js
          node --check assets/100-safe-upgrades-loader-v236272.js
          node --check assets/168-triovist-summary-360-v1.js
          node --check assets/169-triovist-tasks360-ux-v1.js
      - name: Test Uni X, old Summary and Tasks regressions
        run: node --test tests/triovist-unix-director-v1.test.mjs tests/triovist-summary-360-v1.test.mjs tests/triovist-tasks360-ux-v1.test.mjs tests/triovist-native-sections-v1.test.mjs tests/triovist-groups-single-screen-v1.test.mjs tests/triovist-motivation-director-v1.test.mjs tests/triovist-stock-director-v1.test.mjs
      - name: Ensure parser and database unchanged by this PR
        run: |
          git diff --name-only origin/main...HEAD > /tmp/changed-files
          if [ "${GITHUB_HEAD_REF:-}" = "release/triovist-pilot-20261124" ]; then
            node tests/triovist-production-rollout-scope-v1.mjs /tmp/changed-files
          fi
          cat /tmp/changed-files
          # Keep this older scope gate specific to its own feature branch; tests still run.
          if [ "$GITHUB_HEAD_REF" = "fix/manager-feedback-20261106" ]; then exit 0; fi
          ! grep -E '(^assets/(80-triovist-21vek-control-v236107|106-triovist-competitors-v236218)[.]js$|^[.]github/workflows/.*parser)' /tmp/changed-files
          # Reviewed client metadata/RPC migrations and scoped Lera reader; protected parser files still denied.
          # Reviewed optional AIR3 MP3 endpoint; auth and single-charge tests remain mandatory.
          node --test tests/air3-tts-optional-mp3-20261116.test.mjs
          # Scoped Lera source/subject guards and the equivalent sales reader require regression checks.
          node --test tests/lera-sales-source-guard-20261117.test.mjs tests/lera-client-meeting-subject-20261117.test.mjs tests/control-sales-summary-20261117.test.mjs
          ! (grep '^supabase/' /tmp/changed-files | grep -v -Fx -e 'supabase/functions/crm-voice-yandex-tts-v1/index.ts' -e 'supabase/functions/_shared/lera-dialogue-core-v2.mjs' -e 'supabase/functions/crm-ai360-dialog-v4/index.ts' -e 'supabase/functions/crm-ai360-dialog-v4/dialogue-core.mjs' -e 'supabase/functions/crm-ai360-director-peer-v1/index.ts' -e 'supabase/functions/crm-ai360-director-peer-v1/dialogue-core.mjs' -e 'supabase/functions/crm-ai360-staff-dialog-v1/index.ts' -e 'supabase/functions/crm-ai360-staff-dialog-v1/dialogue-core.mjs' -e 'supabase/migrations/20261117041634_control_sales_summary_v1.sql' -e 'supabase/migrations/20261105_triovist_ai_demand_preview_v1.sql' -e 'supabase/migrations/20261105_triovist_ai_task_draft_v1.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_subgroups_preview_v2.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_approve_v2.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_verify_v2.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_manual_target_fix_v3.sql' -e 'supabase/migrations/20261105_triovist_ai_brainstorm_listing_provenance_v3.sql' -e 'supabase/migrations/20261105_gps_director360_evidence_v1.sql' -e 'supabase/migrations/20261105_gps_director360_stop_reviews_v1.sql' -e 'supabase/migrations/20261105_gps_director360_live_stops_v1.sql' -e 'supabase/migrations/20261106_gps360_safe_history_v1.sql' -e 'supabase/migrations/20261106_gps360_store_onsite_v1.sql' -e 'supabase/migrations/20261106_gps360_probable_stops_v1.sql' -e 'supabase/migrations/20261106_gps360_evidence_completed_v2.sql' -e 'supabase/migrations/20261106142000_gps360_exact_physical_store_read_v1.sql' -e 'supabase/migrations/20261106143500_gps360_vip_new_clients_guard_v1.sql' -e 'supabase/migrations/20261109_triovist_search360_isolated_v1.sql' -e 'supabase/migrations/20261109_triovist_search360_negative_coverage_v2.sql' -e 'supabase/migrations/20261109_triovist_decisions360_task_facts_v1.sql' -e 'supabase/migrations/20