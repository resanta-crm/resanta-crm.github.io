name: AI360 v4 isolated checks
on:
  push:
    branches:
      - feature/ai360-real-tool-core-v4-20261028
    paths:
      - 'supabase/functions/crm-ai360-dialog-v4/**'
      - 'tests/ai360-core-v4-smoke.test.mjs'
      - '.github/workflows/ai360-core-v4.yml'
  pull_request:
    paths:
      - 'supabase/functions/crm-ai360-dialog-v4/**'
      - 'tests/ai360-core-v4-smoke.test.mjs'
      - '.github/workflows/ai360-core-v4.yml'
permissions:
  contents: read
jobs:
  node-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pure module syntax
        run: |
          node --check supabase/functions/crm-ai360-dialog-v4/core.mjs
          node --check supabase/functions/crm-ai360-dialog-v4/catalog.mjs
          node --check supabase/functions/crm-ai360-dialog-v4/task-read.mjs
      - name: Run read-only, tool selection and task-date regression tests
        run: node --test tests/ai360-core-v4-smoke.test.mjs
