name: Импорт ПДЗ из почты в CRM

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# ПДЗ и поступления читают один Gmail-ящик. Никогда не запускаем их одновременно:
# это закрывает IMAP OVERQUOTA и гонки двух финансовых импортов.
concurrency:
  group: finance-imap-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install pandas openpyxl requests

      - name: Запустить устойчивый импорт ПДЗ
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINANCE_SOCKET_TIMEOUT_SECONDS: '45'
          PDZ_LOOKBACK_DAYS: '14'
          PDZ_MAX_AGE_DAYS: '1'
          PDZ_HEADER_BATCH_SIZE: '100'
          PDZ_HEADER_SCAN_LIMIT: '3000'
          PDZ_MAX_CANDIDATE_EMAILS: '12'
        run: python finance_import_runner.py pdz
