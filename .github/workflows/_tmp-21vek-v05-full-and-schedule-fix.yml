name: TEMP — 21vek v0.5 full + schedule hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-21vek-v05-full-and-schedule-fix.yml'

permissions:
  contents: write

concurrency:
  group: triovist-21vek-v05-maintenance
  cancel-in-progress: false

jobs:
  maintain-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harden shadow schedule without touching CRM
        shell: python
        run: |
          from pathlib import Path

          sync=Path('tools/triovist_21vek_shadow_sync.py')
          s=sync.read_text(encoding='utf-8')
          if 'SKIP_RECENT_HOURS=' not in s:
              s=s.replace(
                  'TIMEOUT=max(10,int(os.environ.get("SHADOW_HTTP_TIMEOUT","25")))\n',
                  'TIMEOUT=max(10,int(os.environ.get("SHADOW_HTTP_TIMEOUT","25")))\nSKIP_RECENT_HOURS=max(0.0,float(os.environ.get("SHADOW_SKIP_RECENT_COMPLETE_HOURS","0")))\n'
              )
              anchor='def current_targets() -> list[dict]:\n'
              helper='''def recent_complete_matches(target_count: int) -> bool:\n    if SKIP_RECENT_HOURS<=0:\n        return False\n    rows=rest_get("triovist_21vek_shadow_runs",{\n        "parser_version":f"eq.{PARSER_VERSION}",\n        "status":"eq.complete",\n        "select":"total_targets,success_count,error_count,finished_at",\n        "order":"finished_at.desc",\n        "limit":"1"\n    })\n    if not rows:\n        return False\n    row=rows[0]\n    if int(row.get("total_targets") or 0)!=int(target_count):\n        return False\n    if int(row.get("success_count") or 0)!=int(target_count) or int(row.get("error_count") or 0)!=0:\n        return False\n    raw=row.get("finished_at")\n    if not raw:\n        return False\n    try:\n        finished=datetime.fromisoformat(str(raw).replace("Z","+00:00"))\n        age=(datetime.now(timezone.utc)-finished.astimezone(timezone.utc)).total_seconds()/3600\n    except Exception:\n        return False\n    return 0<=age<=SKIP_RECENT_HOURS\n\n\n'''
              if anchor not in s:
                  raise SystemExit('current_targets anchor not found')
              s=s.replace(anchor,helper+anchor,1)
              old='''def main() -> None:\n    targets=current_targets()\n    run_id=insert_run(len(targets))\n'''
              new='''def main() -> None:\n    targets=current_targets()\n    if recent_complete_matches(len(targets)):\n        print(f"Shadow skip: fresh complete {PARSER_VERSION} run already covers {len(targets)} targets",flush=True)\n        return\n    run_id=insert_run(len(targets))\n'''
              if old not in s:
                  raise SystemExit('main anchor not found')
              s=s.replace(old,new,1)
              sync.write_text(s,encoding='utf-8')

          wf=Path('.github/workflows/triovist-21vek-shadow-sync.yml')
          w=wf.read_text(encoding='utf-8')
          if "- cron: '17 5 * * *'" not in w:
              w=w.replace("    - cron: '17 3 * * *'\n", "    - cron: '17 3 * * *'\n    # Резерв 08:17 по Минску. Если основной полный снимок уже готов, скрипт завершится без нового run.\n    - cron: '17 5 * * *'\n",1)
          old="""          LIMIT='2500'\n          if [ \"$GITHUB_EVENT_NAME\" = 'push' ]; then\n            LIMIT='300'\n          elif [ \"$GITHUB_EVENT_NAME\" = 'workflow_dispatch' ] && [ -n \"$DISPATCH_LIMIT\" ]; then\n            LIMIT=\"$DISPATCH_LIMIT\"\n          fi\n          echo \"Shadow 21vek limit: $LIMIT\"\n          SHADOW_LIMIT=\"$LIMIT\" SHADOW_OFFSET='0' python tools/triovist_21vek_shadow_sync.py\n"""
          new="""          LIMIT='2500'\n          SKIP_RECENT='0'\n          if [ \"$GITHUB_EVENT_NAME\" = 'push' ]; then\n            LIMIT='300'\n          elif [ \"$GITHUB_EVENT_NAME\" = 'workflow_dispatch' ] && [ -n \"$DISPATCH_LIMIT\" ]; then\n            LIMIT=\"$DISPATCH_LIMIT\"\n          elif [ \"$GITHUB_EVENT_NAME\" = 'schedule' ]; then\n            SKIP_RECENT='4'\n          fi\n          echo \"Shadow 21vek limit: $LIMIT; skip recent complete: ${SKIP_RECENT}h\"\n          SHADOW_LIMIT=\"$LIMIT\" SHADOW_OFFSET='0' SHADOW_SKIP_RECENT_COMPLETE_HOURS=\"$SKIP_RECENT\" python tools/triovist_21vek_shadow_sync.py\n"""
          if old not in w:
              if 'SHADOW_SKIP_RECENT_COMPLETE_HOURS' not in w:
                  raise SystemExit('workflow run block anchor not found')
          else:
              w=w.replace(old,new,1)
          wf.write_text(w,encoding='utf-8')

      - name: Commit schedule hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/triovist_21vek_shadow_sync.py .github/workflows/triovist-21vek-shadow-sync.yml
          git diff --cached --check
          git commit -m '21vek shadow: add guarded backup daily run' || true
          git push

      - name: Install parser dependencies
        run: pip install requests beautifulsoup4

      - name: Full shadow v0.5 — all current cards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SHADOW_DELAY_SECONDS: '0.8'
          SHADOW_HTTP_TIMEOUT: '25'
          SHADOW_LIMIT: '2500'
          SHADOW_OFFSET: '0'
          SHADOW_SKIP_RECENT_COMPLETE_HOURS: '0'
        run: python tools/triovist_21vek_shadow_sync.py

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git rm -f .github/workflows/_tmp-21vek-v05-full-and-schedule-fix.yml || true
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore: remove temporary 21vek maintenance workflow' || exit 0
          git push
