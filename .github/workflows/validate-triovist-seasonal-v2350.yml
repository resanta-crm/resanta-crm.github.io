name: Validate Triovist seasonal v23.5.0

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triovist-seasonal-validate-trigger-v2350'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax
        run: node --check assets/13-triovist-seasonal-stock-v2350.js
      - name: Check Python syntax
        run: python -m py_compile build_triovist_seasonality.py
      - name: Check generated profile
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/triovist_seasonality.json',encoding='utf-8'))
          assert p['version']=='v23.5.0'
          assert p['levels']['sku']
          assert p['levels']['subgroup']
          assert p['levels']['category']
          print(p['counts'])
          PY
      - name: Write validation marker
        run: |
          python - <<'PY'
          import json, datetime
          p=json.load(open('data/triovist_seasonality.json',encoding='utf-8'))
          out={
            'version':'v23.5.0',
            'status':'ok',
            'validated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'counts':p.get('counts',{}),
            'history_from':p.get('history_from'),
            'history_to':p.get('history_to'),
            'checks':['node --check','python py_compile','profile structure']
          }
          open('data/triovist-seasonal-validation.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False))
          PY
          git config user.name "resanta-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/triovist-seasonal-validation.json
          git commit -m "Validate Triovist seasonal v23.5.0" || exit 0
          git push
