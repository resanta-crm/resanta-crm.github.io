name: Connect corrected AI manager plans v23.1.1

on:
  push:
    paths:
      - '.github/workflows/connect-ai-manager-plans-v2311.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect corrected module and bump app version
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_version = "const APP_VERSION = '2026-08-17-resanta-crm-v23.0.0';"
          new_version = "const APP_VERSION = '2026-08-18-resanta-crm-v23.1.1';"
          if old_version in text:
              text = text.replace(old_version, new_version, 1)
          elif new_version not in text:
              raise SystemExit('APP_VERSION anchor not found; index.html left untouched')

          core = '<script defer src="./assets/06-root-fixes.js?v=23.0.0"></script>'
          ai = '<script defer src="./assets/07-ai-manager-plans.js?v=23.1.1"></script>'
          if ai not in text:
              if core not in text:
                  raise SystemExit('06-root-fixes script anchor not found; index.html left untouched')
              text = text.replace(core, core + '\n' + ai, 1)

          if text.count(ai) != 1:
              raise SystemExit('AI module reference must exist exactly once')
          p.write_text(text, encoding='utf-8')

      - name: Commit deployment
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes required"
            exit 0
          fi
          git config user.name "resanta-crm"
          git config user.email "resantavitebsc@gmail.com"
          git add index.html
          git commit -m "Connect corrected AI manager plans v23.1.1"
          git push origin HEAD:main
