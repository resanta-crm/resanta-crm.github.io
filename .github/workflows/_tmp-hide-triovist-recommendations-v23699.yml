name: TEMP — hide Triovist subgroup recommendations v23.6.99

on:
  push:
    paths:
      - '.github/workflows/_tmp-hide-triovist-recommendations-v23699.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Triovist loader and cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('assets/66-performance-root-v23657.js')
          s = root.read_text(encoding='utf-8')
          old_v = "const V='23.6.97',flights=new Map(),contractFlights=new Map();"
          new_v = "const V='23.6.99',flights=new Map(),contractFlights=new Map();"
          if old_v not in s:
              raise SystemExit('STOP: expected performance root version not found')
          s = s.replace(old_v, new_v, 1)

          anchor = "    load('assets/61-triovist-task-month-safe-v23651.js','perf-tri-month-v23671','RESANTA_TRIOVIST_TASK_MONTH_SAFE_V23651')"
          replacement = anchor + ",\n    load('assets/78-triovist-hide-recommendations-v23699.js','perf-tri-hide-recs-v23699','RESANTA_TRIOVIST_RECOMMENDATIONS_HIDDEN_V23699')"
          if anchor not in s:
              raise SystemExit('STOP: Triovist loader anchor not found')
          if '78-triovist-hide-recommendations-v23699.js' not in s:
              s = s.replace(anchor, replacement, 1)
          root.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          old_app = "const APP_VERSION = '2026-09-10-resanta-crm-v23.6.98';"
          new_app = "const APP_VERSION = '2026-09-10-resanta-crm-v23.6.99';"
          if old_app not in h:
              raise SystemExit('STOP: expected APP_VERSION not found')
          h = h.replace(old_app, new_app, 1)
          old_src = './assets/66-performance-root-v23657.js?v=23.6.97'
          new_src = './assets/66-performance-root-v23657.js?v=23.6.99'
          if old_src not in h:
              raise SystemExit('STOP: performance root cache URL not found')
          h = h.replace(old_src, new_src, 1)
          idx.write_text(h, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check assets/66-performance-root-v23657.js
          node --check assets/78-triovist-hide-recommendations-v23699.js
          git diff --check

      - name: Commit production patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-hide-triovist-recommendations-v23699.yml
          git add assets/66-performance-root-v23657.js assets/78-triovist-hide-recommendations-v23699.js index.html
          git commit -m "Triovist: remove redundant subgroup recommendations (v23.6.99)"
          git push origin main
