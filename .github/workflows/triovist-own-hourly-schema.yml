name: Triovist own hourly schema isolation
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261105093000_triovist_parser_hourly_uniai_unix_v1.sql'
      - 'tests/triovist-parser-hourly-schema.test.mjs'
      - '.github/workflows/triovist-own-hourly-schema.yml'
permissions:
  contents: read
jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated RLS and manager access contract
        run: node --test tests/triovist-parser-hourly-schema.test.mjs
