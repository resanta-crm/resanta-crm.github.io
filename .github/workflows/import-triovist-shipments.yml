name: Триовист — отгрузки 1С
on:
  workflow_dispatch:
  schedule:
    - cron: '50 7,12,17 * * 1-6'
concurrency:
  group: triovist-shipments
  cancel-in-progress: false
jobs:
  import-shipments:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check openpyxl requests
      - name: Обновить отгрузки ООО Триовист
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRIOVIST_SHIPMENTS_LOOKBACK_DAYS: '14'
          TRIOVIST_SHIPMENTS_SUBJECT_KEYS: 'отгруз,триовист'
        run: python import_triovist_shipments.py
