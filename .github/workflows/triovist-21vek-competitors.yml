name: Триовист — 21vek · рынок конкурентов

on:
  push:
    branches: [main]
    paths:
      - 'tools/triovist_21vek_market.py'
      - 'tools/triovist_21vek_parser.py'
      - 'assets/106-triovist-competitors-v236218.js'
      - 'supabase/migrations/20261006_triovist_market_auto_v236224.sql'
      - '.github/workflows/triovist-21vek-competitors.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/triovist_21vek_market.py'
      - 'tools/triovist_21vek_parser.py'
      - 'assets/106-triovist-competitors-v236218.js'
      - 'supabase/migrations/20261006_triovist_market_auto_v236224.sql'
      - '.github/workflows/triovist-21vek-competitors.yml'
  schedule:
    # После основного собственного парсера 21vek. Позиция/цена фиксируются ежедневно.
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: triovist-21vek-market
  cancel-in-progress: true

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверить синтаксис нового контура
        run: |
          python -m py_compile tools/triovist_21vek_market.py tools/triovist_21vek_parser.py
          node --check assets/106-triovist-competitors-v236218.js

      - name: Установить зависимости
        run: pip install requests beautifulsoup4

      - name: Проверка рынка — Конвекторы + Масляные радиаторы + Тепловентиляторы + Тепловые пушки + Бензопилы + Инфракрасные
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MARKET_VALIDATE_PROFILES: 'convector,oil_radiator,fan_heater,heat_gun,chainsaw_gas,infrared_heater'
          MARKET_DELAY_SECONDS: '0.22'
          MARKET_HTTP_TIMEOUT: '30'
          MARKET_SPEC_TTL_DAYS: '30'
        run: python tools/triovist_21vek_market.py
