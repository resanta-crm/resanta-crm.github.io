name: Триовист — 21vek · рынок конкурентов

on:
  push:
    branches: [main]
    paths:
      - 'tools/triovist_21vek_market.py'
      - 'tools/triovist_21vek_parser.py'
      - 'assets/106-triovist-competitors-v236218.js'
      - 'supabase/migrations/20261006_triovist_market_auto_v236224.sql'
      - '.github/workflows/triovist-21vek-competitors.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/triovist_21vek_market.py'
      - 'tools/triovist_21vek_parser.py'
      - 'assets/106-triovist-competitors-v236218.js'
      - 'supabase/migrations/20261006_triovist_market_auto_v236224.sql'
      - '.github/workflows/triovist-21vek-competitors.yml'
  schedule:
    # Полный рынок — только ночью. GitHub schedule может стартовать с задержкой,
    # поэтому ставим 18:17 UTC (21:17 Минск): даже при большой задержке не попадаем
    # в основной рабочий день. Ручной workflow_dispatch остаётся доступен.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Необязательно: точный список profile_key через запятую'
        required: false
        default: ''
        type: string

concurrency:
  group: triovist-21vek-market
  # Never kill a real market cycle because a later UI/syntax-only commit arrived.
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверить синтаксис нового контура
        run: |
          python -m py_compile tools/triovist_21vek_market.py tools/triovist_21vek_parser.py
          node --check assets/106-triovist-competitors-v236218.js

      - name: Установить зависимости
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[market-target-pumps]') || contains(github.event.head_commit.message, '[market-target-circulation]') || contains(github.event.head_commit.message, '[market-target-analog-fix]')))
        run: pip install requests beautifulsoup4

      - name: Проверка рынка 21vek
        # Обычный push проверяет только синтаксис. Полный рынок идёт ночью.
        # Маркеры позволяют безопасно прогнать только нужные новые профили.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[market-target-pumps]') || contains(github.event.head_commit.message, '[market-target-circulation]') || contains(github.event.head_commit.message, '[market-target-analog-fix]')))
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MANUAL_PROFILES: ${{ inputs.profiles }}
          TARGET_PUMPS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[market-target-pumps]') }}
          TARGET_CIRCULATION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[market-target-circulation]') }}
          TARGET_ANALOG_FIX: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[market-target-analog-fix]') }}
          MARKET_DELAY_SECONDS: '0.22'
          MARKET_HTTP_TIMEOUT: '30'
          MARKET_SPEC_TTL_DAYS: '30'
        run: |
          if [ "$TARGET_ANALOG_FIX" = "true" ]; then
            export MARKET_VALIDATE_PROFILES='planer,sewage_station,borehole_pump,fecal_pump,snow_blower'
            export MARKET_VALIDATE_EXACT='1'
          elif [ "$TARGET_CIRCULATION" = "true" ]; then
            export MARKET_VALIDATE_PROFILES='circulation_pump'
            export MARKET_VALIDATE_EXACT='1'
          elif [ "$TARGET_PUMPS" = "true" ]; then
            export MARKET_VALIDATE_PROFILES='fecal_pump,circulation_pump'
            export MARKET_VALIDATE_EXACT='1'
          elif [ -n "$MANUAL_PROFILES" ]; then
            export MARKET_VALIDATE_PROFILES="$MANUAL_PROFILES"
            export MARKET_VALIDATE_EXACT='1'
          else
            export MARKET_VALIDATE_PROFILES='convector,oil_radiator,fan_heater,heat_gun,humidifier,chainsaw_electric,snow_blower,leaf_blower,chainsaw_gas,infrared_heater'
            export MARKET_VALIDATE_EXACT='0'
          fi
          python tools/triovist_21vek_market.py
