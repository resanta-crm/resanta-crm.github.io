name: TEMP publish Triovist groups v23.6.120

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-triovist-groups-v236120.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch isolated Triovist analytics
        run: python patch_triovist_groups_v236120.py
      - name: Validate JavaScript
        run: |
          node --check assets/82-triovist-group-dynamics-v236120.js
          node --check assets/34-triovist-root-v23614.js
          node --check assets/32-triovist-v23611.js
          node --check assets/66-performance-root-v23657.js
      - name: Commit
        run: |
          git config user.name resanta-crm-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "feat: Triovist groups and dynamics v23.6.120"
          git push
