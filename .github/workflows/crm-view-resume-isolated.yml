name: CRM tab resume isolated regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/178-crm-view-resume-v1.js'
      - 'tests/crm-view-resume-v1.test.mjs'
      - 'index.html'
      - 'assets/61-triovist-task-month-safe-v23651.js'
      - '.github/workflows/crm-view-resume-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  view-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax, session isolation and keep current tab
        run: |
          node --check assets/178-crm-view-resume-v1.js
          node --test tests/crm-view-resume-v1.test.mjs
      - name: Protect existing auth, manager, parser and cards while allowing new AI RPCs
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD | tee /tmp/crm-view-resume-changes
          node --test tests/gps360-complete-one-time-geo-v1.test.mjs
          # Manager feedback has its own route and migration regression coverage.
          if [ "$GITHUB_HEAD_REF" = "fix/manager-feedback-20261106" ]; then exit 0; fi
          # Approved calendar navigation exception only; any other Triovist edit still fails.
          if [ "$(git hash-object assets/03-triovist-routes.js)" = "6cd4846be3bde024d1c088ffbe9e1f1f4f249c25" ]; then
            grep -vxF 'assets/03-triovist-routes.js' /tmp/crm-view-resume-changes > /tmp/calendar-reviewed-changes || true
            mv /tmp/calendar-reviewed-changes /tmp/crm-view-resume-changes
          fi
          ! grep -E '^assets/(03-triovist-routes|80-triovist-21vek-control-v236107|106-triovist-competitors-v236218)[.]js$' /tmp/crm-view-resume-changes
          # Explicit client migrations reviewed with client/RBAC tests; auth and existing business code remain protected.
          ! (grep '^supabase/migrations/' /tmp/crm-view-resume-changes | grep -v -E '^supabase/migrations/(20261105_(triovist_ai_.*|gps_director360_(evidence_v1|stop_reviews_v1|live_stops_v1))|20261106_gps360_(safe_history_v1|store_onsite_v1|probable_stops_v1|evidence_completed_v2)|20261106142000_gps360_exact_physical_store_read_v1|20261106143500_gps360_vip_new_clients_guard_v1|20261109_triovist_search360_isolated_v1|20261109_triovist_search360_negative_coverage_v2|20261109_triovist_decisions360_task_facts_v1|20261109_triovist_decisions360_category_evidence_v1|20261109_warehouse_vitebsk360_truth_v1|20261109_warehouse_vitebsk360_order_approval_v1|20261109_warehouse_vitebsk360_approved_document_v1|20261109_gps360_director_decisions_recheck_v1|20261111134000_triovist_market_ai_investigations_v1|20261114075736_clients_unified_security_and_ytd|20261114080346_clients_detail_route_reference_cast|20261114083710_clients_registry_filters_and_journal|20261114091749_clients_journal_polymorphic_trigger|20261114094230_clients_detail_debt_history|20261114095103_clients_explicit_branch_scope|20261114101240_clients_confirmed_legal_sales_reader|20261114123011_lpr_birthdays_scoped_delivery_v2|20261114130543_lpr_birthdays_dispatch_schedule_v2|20261114151152_connect_delivery_calls_v2|20261114153455_connect_dispatch_schedule_v2|20261114154128_connect_structured_calls_v2|20261115060126_calendar_meetings_v2|20261115063519_calendar_metrics_current_sources_v2|20261115071505_calendar_profile_checks_v2|20261115072309_calendar_metrics_column_resolution_v2|20261115090146_calendar_invitations_v3|20261115092827_calendar_invitation_read_status_v3|20261115121815_tasks_route_create_v4|20261115135910_tasks_shelf_assignments_and_evidence_v4|20261115121518_tasks_route_feed_and_guard_v4|20261115115753_tasks_daily_route_v4|20261115172029_tasks_route_workspace_v5|20261115173739_tasks_profile_variable_v5|20261115173823_tasks_empty_shelf_v5|20261115174426_tasks_route_scope_null_guard_v5|20261116060653_tasks_field_assortment_guard|20261116075811_crm_support_v1|20261116080332_crm_support_pending_v1|20261116080706_crm_support_schedule_v1)[.]sql$')
