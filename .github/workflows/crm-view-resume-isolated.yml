name: CRM tab resume isolated regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/178-crm-view-resume-v1.js'
      - 'tests/crm-view-resume-v1.test.mjs'
      - 'index.html'
      - 'assets/61-triovist-task-month-safe-v23651.js'
      - '.github/workflows/crm-view-resume-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  view-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax, session isolation and keep current tab
        run: |
          node --check assets/178-crm-view-resume-v1.js
          node --test tests/crm-view-resume-v1.test.mjs
      - name: Protect existing auth, manager, parser and cards while allowing new AI RPCs
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD | tee /tmp/crm-view-resume-changes
          node --test tests/gps360-complete-one-time-geo-v1.test.mjs
          # Manager feedback has its own route and migration regression coverage.
          if [ "$GITHUB_HEAD_REF" = "fix/manager-feedback-20261106" ]; then exit 0; fi
          ! grep -E '^assets/(03-triovist-routes|80-triovist-21vek-control-v236107|106-triovist-competitors-v236218)[.]js$' /tmp/crm-view-resume-changes
          ! (grep '^supabase/migrations/' /tmp/crm-view-resume-changes | grep -v -E '^supabase/migrations/(20261105_(triovist_ai_.*|gps_director360_(evidence_v1|stop_reviews_v1|live_stops_v1))|20261106_gps360_(safe_history_v1|store_onsite_v1|probable_stops_v1|evidence_completed_v2)|20261106142000_gps360_exact_physical_store_read_v1|20261106143500_gps360_vip_new_clients_guard_v1|20261109_triovist_search360_isolated_v1|20261109_triovist_search360_negative_coverage_v2|20261109_triovist_decisions360_task_facts_v1|20261109_triovist_decisions360_category_evidence_v1|20261109_warehouse_vitebsk360_truth_v1|20261109_warehouse_vitebsk360_order_approval_v1|20261109_warehouse_vitebsk360_approved_document_v1)[.]sql$')
