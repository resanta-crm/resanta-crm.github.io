name: TMP — Promotions finance clarity v23.6.131

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-promotions-finance-v236131.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fix reserve clarity and hard-hide VIP actions
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Closing finance: reserve is a hold, expenses consume that hold.
          p=Path('assets/65-promotions-close-v23656.js')
          s=p.read_text(encoding='utf-8')
          reps=[
            ("/* RESANTA CRM v23.6.56 · PROMOTIONS ROOT CLOSE FLOW", "/* RESANTA CRM v23.6.131 · PROMOTIONS ROOT CLOSE FLOW"),
            ("const V='v23.6.56';", "const V='v23.6.131';"),
            ("const reserved=num(p.budget_reserved),spent=expenseTotal(p),candidateRows", "const reserved=num(p.budget_reserved),spent=Math.max(num(p.actual_spend),expenseTotal(p)),usedFromReserve=Math.min(reserved,spent),overReserve=Math.max(0,spent-reserved),candidateRows"),
            ("const releaseLabel=confirmed?'Вернётся в свободный бюджет':'Остаток резерва к проверке';", "const releaseLabel=confirmed?'Освободится при закрытии':'Осталось в резерве';"),
            ("<div class=\"promo56-label\">Резерв акции</div>", "<div class=\"promo56-label\">Согласованный резерв</div>"),
            ("<div class=\"promo56-label\">Фактически потрачено</div>", "<div class=\"promo56-label\">Уже списано из бюджета</div>"),
            ("только операции бюджета, привязанные к этой акции", "расходы по акции автоматически уменьшают её остаток резерва"),
            ("+(confirmed?'финансовый итог подтверждён':'это ещё не возврат: сначала проверьте все расходы')+", "+(confirmed?'это именно неиспользованный остаток; он освободится':'каждый привязанный расход уменьшает эту сумму автоматически')+"),
            ("Потраченные деньги никогда не возвращаются. После закрытия освобождается только подтверждённо неиспользованный остаток резерва.", "Расход списывается из бюджета один раз и автоматически уменьшает остаток резерва. При закрытии освобождается только подтверждённо неиспользованный остаток — повторного списания нет."),
            ("const spent=expenseTotal(p),reserved=num(p.budget_reserved),release=Math.max(0,reserved-spent);", "const spent=Math.max(num(p.actual_spend),expenseTotal(p)),reserved=num(p.budget_reserved),release=Math.max(0,reserved-spent);"),
            ("Резерв: '+fmtSafe(reserved)+' BYN", "Согласованный резерв: '+fmtSafe(reserved)+' BYN"),
            ("Фактически потрачено: '+fmtSafe(spent)+' BYN", "Уже списано из бюджета: '+fmtSafe(spent)+' BYN"),
            ("Неиспользованный остаток резерва: '+fmtSafe(release)+' BYN", "Освободится остаток резерва: '+fmtSafe(release)+' BYN"),
            ("Потраченные деньги останутся списанными.", "Расходы уже списаны из бюджета один раз. При закрытии освободится только остаток резерва."),
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit('65 guard failed: '+old[:90])
              s=s.replace(old,new,1)
          # Show explicitly how much of the reserve has already been consumed; overrun only if it exists.
          marker="+'<div class=\"promo56-cell\"><div class=\"promo56-label\">Уже списано из бюджета</div><div class=\"promo56-value\">'+fmtSafe(spent)+' BYN</div><div class=\"promo56-sub\">расходы по акции автоматически уменьшают её остаток резерва</div></div>'"
          if marker not in s: raise SystemExit('65 spent cell marker failed')
          repl=marker+"\n  +'<div class=\"promo56-cell\"><div class=\"promo56-label\">Из резерва уже использовано</div><div class=\"promo56-value\">'+fmtSafe(usedFromReserve)+' BYN</div><div class=\"promo56-sub\">'+(overReserve>0?'сверх резерва: '+fmtSafe(overReserve)+' BYN':'в пределах согласованного резерва')+'</div></div>'"
          s=s.replace(marker,repl,1)
          p.write_text(s,encoding='utf-8')

          # 2) VIP actions: old module may redraw the nav after our normal hide.
          p=Path('assets/68-vip-actions-nav-v23659.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/* RESANTA CRM v23.6.130 · VIP ACTIONS HIDDEN','/* RESANTA CRM v23.6.131 · VIP ACTIONS HIDDEN',1)
          old="if(window.RESANTA_VIP_ACTIONS_NAV_V23659)return;\n\nfunction hide(){"
          new="""if(window.RESANTA_VIP_ACTIONS_NAV_V23659)return;

function hardCss(){
  if(document.getElementById('vip-actions-hard-hidden-v236131'))return;
  const s=document.createElement('style');
  s.id='vip-actions-hard-hidden-v236131';
  s.textContent='#nav-vip-actions,#nav-vip-actions-bootstrap,#page-vip-actions{display:none!important;visibility:hidden!important;pointer-events:none!important}';
  document.head.appendChild(s);
}
// If the legacy VIP module is injected later, make its top-level guard already satisfied.
if(!window.RESANTA_VIP_ACTIONS_V23659)window.RESANTA_VIP_ACTIONS_V23659=Object.freeze({version:'disabled-v23.6.131',disabled:true});

function hide(){"""
          if old not in s: raise SystemExit('68 guard failed')
          s=s.replace(old,new,1)
          s=s.replace("function boot(){\n  hide();", "function boot(){\n  hardCss();\n  hide();",1)
          s=s.replace("version:'v23.6.130'", "version:'v23.6.131'",1)
          p.write_text(s,encoding='utf-8')

          # 3) Force fresh root + fresh VIP guard in browsers.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changes=[
            ("const APP_VERSION = '2026-09-16-resanta-crm-v23.6.130';", "const APP_VERSION = '2026-09-16-resanta-crm-v23.6.131';"),
            ('<script defer src="./assets/66-performance-root-v23657.js?v=23.6.130"></script>', '<script defer src="./assets/66-performance-root-v23657.js?v=23.6.131"></script>'),
            ('<script defer src="./assets/68-vip-actions-nav-v23659.js?v=23.6.124"></script>', '<script defer src="./assets/68-vip-actions-nav-v23659.js?v=23.6.131"></script>'),
          ]
          for old,new in changes:
              if s.count(old)!=1: raise SystemExit(f'index guard failed: {old} matches={s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git add assets/65-promotions-close-v23656.js assets/68-vip-actions-nav-v23659.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix promotion reserve clarity and VIP nav v23.6.131'
          git push
