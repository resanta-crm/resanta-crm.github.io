name: One-time Triovist AI v23.4.7 final

on:
  push:
    paths:
      - '.github/workflows/one-time-triovist-ai-v2347-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate independent Triovist AI v23.4.7
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          replacements = [
              ("const APP_VERSION = '2026-08-18-resanta-crm-v23.4.6';", "const APP_VERSION = '2026-08-18-resanta-crm-v23.4.7';"),
              ('./assets/09-manager-kpi-save-fix.js?v=23.4.6', './assets/09-manager-kpi-save-fix.js?v=23.4.7'),
              ('./assets/11-triovist-ai-plans-v2346.js?v=23.4.6" data-triovist-ai-root-v2344="1"', './assets/11-triovist-ai-plans-v2347.js?v=23.4.7" data-triovist-ai-root-v2347="1"'),
          ]
          for old, new in replacements:
              if old not in h:
                  raise SystemExit(f'Expected root marker not found: {old}')
              h = h.replace(old, new, 1)
          p.write_text(h, encoding='utf-8')

      - name: Validate and clean obsolete Triovist AI modules
        run: |
          node --check assets/11-triovist-ai-plans-v2347.js
          rm -f assets/11-triovist-ai-plans-v2340.js
          rm -f assets/11-triovist-ai-plans-v2345.js
          rm -f assets/11-triovist-ai-plans-v2346.js
          rm -f .github/workflows/one-time-triovist-ai-v2347-final.yml
          git config user.name "resanta-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/11-triovist-ai-plans-v2340.js assets/11-triovist-ai-plans-v2345.js assets/11-triovist-ai-plans-v2346.js assets/11-triovist-ai-plans-v2347.js .github/workflows/one-time-triovist-ai-v2347-final.yml
          git commit -m "Finalize independent Triovist AI plans v23.4.7"
          git push
