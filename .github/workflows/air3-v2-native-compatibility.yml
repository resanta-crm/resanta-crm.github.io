name: AIR3 v2 native compatibility APK (isolated)
on:
  pull_request:
    paths:
      - 'android/air3-probe/**'
      - '.github/workflows/air3-v2-native-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test safe voice-intent preview without Android SDK
        run: |
          mkdir -p /tmp/air3-classes
          javac -encoding UTF-8 -d /tmp/air3-classes \
            android/air3-probe/app/src/main/java/by/resanta/air3probe/VoiceNavigation.java \
            android/air3-probe/tests/VoiceNavigationTest.java
          java -cp /tmp/air3-classes by.resanta.air3probe.VoiceNavigationTest
      - name: Ensure probe cannot store CRM credentials or contact network
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/air3-probe/app/src/main/AndroidManifest.xml').read_text()
          src='\n'.join(p.read_text() for p in Path('android/air3-probe/app/src/main/java').rglob('*.java'))
          assert 'android.permission.INTERNET' not in m
          assert 'allowBackup="false"' in m
          for forbidden in ('SharedPreferences', 'CookieManager', 'ACCESS_TOKEN', 'SERVICE_ROLE_KEY', 'localhost:'):
              assert forbidden not in src
          assert 'requestPermissions' in src
          assert 'MediaProjectionManager' in src
          print('AIR3 isolated probe privacy baseline passed')
          PY

  assemble-debug:
    runs-on: ubuntu-latest
    needs: navigation-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already has Android SDK. setup-android@v3
      # currently fails trying to install the removed legacy 'tools' package.
      - name: Verify runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          ls "$ANDROID_HOME/platforms" | head
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compatible Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build isolated INMO compatibility APK
        working-directory: android/air3-probe
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: resanta-air3-compatibility-debug
          path: android/air3-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
