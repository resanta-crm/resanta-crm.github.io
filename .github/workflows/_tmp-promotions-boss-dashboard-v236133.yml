name: TMP Promotions boss dashboard v23.6.133

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-promotions-boss-dashboard-v236133.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wire boss dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('assets/88-promotions-effectiveness-v236132.js')
          s=p.read_text(encoding='utf-8')
          old="S.loaded=true;S.at=Date.now();patchAll();return S.rows"
          new="S.loaded=true;S.at=Date.now();patchAll();try{window.dispatchEvent(new CustomEvent('resanta:promotions-effectiveness',{detail:{version:V}}))}catch(_){}return S.rows"
          if s.count(old)!=1: raise SystemExit('effectiveness load guard failed')
          s=s.replace(old,new,1)
          old="window.RESANTA_PROMOTIONS_EFFECTIVENESS_V236132=Object.freeze({version:V,server:true,exactNewSku:true,legacySafe:true,noPolling:true,refresh:()=>load(true),repaint:patchAll});"
          new="window.RESANTA_PROMOTIONS_EFFECTIVENESS_V236132=Object.freeze({version:V,server:true,exactNewSku:true,legacySafe:true,noPolling:true,ensure:()=>load(false),getRows:()=>S.rows,getRow:id=>S.rows.get(safe(id))||null,refresh:()=>load(true),repaint:patchAll});"
          if s.count(old)!=1: raise SystemExit('effectiveness api guard failed')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const APP_VERSION = '2026-09-16-resanta-crm-v23.6.132';"
          new="const APP_VERSION = '2026-09-16-resanta-crm-v23.6.133';"
          if s.count(old)!=1: raise SystemExit('APP_VERSION guard failed')
          s=s.replace(old,new,1)
          old='<script defer src="./assets/66-performance-root-v23657.js?v=23.6.132"></script>'
          new='<script defer src="./assets/66-performance-root-v23657.js?v=23.6.133"></script>'
          if s.count(old)!=1: raise SystemExit('root guard failed')
          s=s.replace(old,new,1)
          old='<script defer src="./assets/88-promotions-effectiveness-v236132.js?v=23.6.132"></script>'
          new='<script defer src="./assets/88-promotions-effectiveness-v236132.js?v=23.6.133"></script>\n<script defer src="./assets/89-promotions-boss-dashboard-v236133.js?v=23.6.133"></script>'
          if s.count(old)!=1: raise SystemExit('effectiveness script guard failed')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git add index.html assets/88-promotions-effectiveness-v236132.js
          git diff --cached --quiet && exit 0
          git commit -m 'Wire promotions boss dashboard v23.6.133'
          git push
