name: 21vek TOP retry and safe resumable promotion
on:
  pull_request:
    paths:
      - 'assets/80-triovist-21vek-control-v236107.js'
      - 'assets/100-safe-upgrades-loader-v236272.js'
      - 'tools/triovist_21vek_top_shadow.py'
      - 'tools/triovist_21vek_refresh_gate.py'
      - 'tools/test_triovist_21vek_top_recovery.py'
      - '.github/workflows/triovist-21vek-shadow-sync.yml'
      - '.github/workflows/triovist-21vek-top-recovery-tests.yml'
  push:
    branches: [main]
    paths:
      - 'assets/80-triovist-21vek-control-v236107.js'
      - 'assets/100-safe-upgrades-loader-v236272.js'
      - 'tools/triovist_21vek_top_shadow.py'
      - 'tools/triovist_21vek_refresh_gate.py'
      - 'tools/test_triovist_21vek_top_recovery.py'
      - '.github/workflows/triovist-21vek-shadow-sync.yml'
      - '.github/workflows/triovist-21vek-top-recovery-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: node --check assets/80-triovist-21vek-control-v236107.js
      - run: node --check assets/100-safe-upgrades-loader-v236272.js
      - run: python -m py_compile tools/triovist_21vek_top_shadow.py tools/triovist_21vek_refresh_gate.py
      - run: python -m unittest discover -s tools -p 'test_triovist_21vek_top_recovery.py' -v
      - run: python -m unittest discover -s tools -p 'test_triovist_21vek_unavailable.py' -v
      - name: Verify fail-closed publication and schedule
        run: |
          python - <<'PY'
          from pathlib import Path
          parser=Path("tools/triovist_21vek_top_shadow.py").read_text()
          gate=Path("tools/triovist_21vek_refresh_gate.py").read_text()
          workflow=Path(".github/workflows/triovist-21vek-shadow-sync.yml").read_text()
          assert "'status':'complete'" in parser
          assert "TOP recovery verification failed" in parser
          assert "top_resume_run_id" in gate and "do_parse=False,do_top=True,do_promote=True" in gate
          assert "TOP_RECOVER_RUN_ID: ${{ steps.gate.outputs.top_resume_run_id }}" in workflow
          assert "cancel-in-progress: false" in workflow
          assert "triovist_21vek_promote.py" in workflow
          ui=Path('assets/80-triovist-21vek-control-v236107.js').read_text()
          assert 'pairedTopMissing' in ui and 'последний успешный TOP' in ui
          print("OK: bounded retry, resume, complete-run gate and unchanged promotion safety")
          PY
