name: Triovist Tasks360 safe UI regression
on:
  push:
    branches:
      - fix/triovist-360-tasks-roles-parser-isolation-20261104
  pull_request:
    paths:
      - "assets/169-triovist-tasks360-ux-v1.js"
      - "assets/61-triovist-task-month-safe-v23651.js"
      - "assets/34-triovist-root-v23614.js"
      - "index.html"
      - "tests/triovist-tasks360-ux-v1.test.mjs"
      - ".github/workflows/triovist-tasks360-safe-ui.yml"
permissions:
  contents: read
jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check assets/169-triovist-tasks360-ux-v1.js
          node --check assets/61-triovist-task-month-safe-v23651.js
          node --check assets/34-triovist-root-v23614.js
      - name: Tasks 360 and Summary 360 regression
        run: node --test tests/triovist-tasks360-ux-v1.test.mjs tests/triovist-summary-360-v1.test.mjs
      - name: Parser files untouched
        run: |
          set -o pipefail
          git fetch origin main
          test -s assets/80-triovist-21vek-control-v236107.js
          test -s assets/106-triovist-competitors-v236218.js
          git diff --name-only origin/main...HEAD | tee /tmp/ui-only-files
          if [ "${GITHUB_HEAD_REF:-}" = "release/triovist-pilot-20261124" ]; then
            node tests/triovist-production-rollout-scope-v1.mjs /tmp/ui-only-files
          fi
          # Reviewed sales reporting RPC. Keep all other database paths protected.
          if grep -qx 'supabase/migrations/20261125160553_crm_sales_month_breakdown_v1.sql' /tmp/ui-only-files; then
            test "$(git hash-object supabase/migrations/20261125160553_crm_sales_month_breakdown_v1.sql)" = '543ee55d90458b6b94213e2af67716b73c6e3c1e'
          fi
          ! (grep -E '(^assets/(80-triovist-21vek-control-v236107|106-triovist-competitors-v236218)\.js$|^supabase/|^\.github/workflows/triovist-21vek)' /tmp/ui-only-files | grep -vxF 'supabase/migrations/20261125160553_crm_sales_month_breakdown_v1.sql')
