name: Продажи полевых — legacy ручной запуск

on:
  workflow_dispatch:

concurrency:
  group: sales-1c-unified-write
  cancel-in-progress: false

jobs:
  import-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать код
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установить зависимости
        run: pip install --disable-pip-version-check openpyxl requests
      - name: Ручной legacy-импорт полевых
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SALES_LOOKBACK_DAYS: '14'
          SALES_IMAP_TIMEOUT_SECONDS: '45'
          SALES_MAX_EMAIL_CANDIDATES: '8'
        run: python import_sales.py
