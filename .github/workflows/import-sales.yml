name: Продажи полевых — независимый импорт 1С каждые 15 минут

on:
  push:
    branches: [main]
    paths:
      - 'import_sales.py'
      - '.github/workflows/import-sales.yml'
  schedule:
    # Отдельный импорт полевых. Минуты смещены от :00/:15/:30/:45,
    # где GitHub Actions чаще задерживает cron под нагрузкой.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: field-sales-write
  cancel-in-progress: false

jobs:
  import-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check openpyxl requests

      - name: Обновить продажи полевых
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SALES_LOOKBACK_DAYS: '14'
          SALES_IMAP_TIMEOUT_SECONDS: '45'
          SALES_MAX_EMAIL_CANDIDATES: '8'
        run: python import_sales.py
