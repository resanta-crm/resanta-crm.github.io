name: Продажи всех менеджеров — автообновление

on:
  push:
    branches: [main]
    paths:
      - 'import_sales.py'
      - '.github/workflows/import-sales.yml'
  schedule:
    # Минск UTC+3. Письмо 1С обычно приходит около 10:00.
    # Несколько запусков после письма страхуют задержки GitHub/Gmail.
    - cron: '15 7,10,13,16 * * *'   # 10:15, 13:15, 16:15, 19:15 Минск
  workflow_dispatch:

concurrency:
  group: all-sales-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check openpyxl requests

      - name: Обновить Руднева, Ачиновича и Шкуран
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SALES_LOOKBACK_DAYS: '14'
          SALES_IMAP_TIMEOUT_SECONDS: '45'
          SALES_MAX_EMAIL_CANDIDATES: '8'
        run: python import_sales.py
