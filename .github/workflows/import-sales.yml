name: Продажи всех менеджеров + Triovist — 6 срезов 1С + почасовая страховка

on:
  push:
    branches: [main]
    paths:
      - 'import_sales.py'
      - 'sync_triovist_sales.py'
      - 'triovist_import_core.py'
      - '.github/workflows/import-sales.yml'
  schedule:
    # Надёжная схема: каждые 15 минут проверяем самое свежее письмо 1С.
    # Дубли import_sales.py пропускает по source_message_at, поэтому лишних
    # перезаписей purchase_history нет.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: all-sales-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check openpyxl requests

      - name: Обновить продажи полевых
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SALES_LOOKBACK_DAYS: '14'
          SALES_IMAP_TIMEOUT_SECONDS: '45'
          SALES_MAX_EMAIL_CANDIDATES: '8'
        run: python import_sales.py

      - name: Обновить и проверить продажи ООО Triovist
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRIOVIST_SALES_LOOKBACK_DAYS: '21'
          TRIOVIST_MAX_EMAIL_CANDIDATES: '8'
        run: python sync_triovist_sales.py
