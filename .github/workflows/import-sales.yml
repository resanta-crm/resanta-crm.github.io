name: Продажи всех менеджеров — автообновление

on:
  push:
    branches: [main]
    paths:
      - 'import_sales.py'
      - '.github/workflows/import-sales.yml'
  schedule:
    # Минск UTC+3. 1С формирует продажи 3 раза в день: 10:00, 14:00 и 18:00.
    # CRM забирает каждый срез через 15 минут, чтобы письмо успело прийти в Gmail.
    - cron: '15 7,11,15 * * *'   # 10:15, 14:15, 18:15 Минск
  workflow_dispatch:

concurrency:
  group: all-sales-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check openpyxl requests

      - name: Обновить Руднева, Ачиновича и Шкуран
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SALES_LOOKBACK_DAYS: '14'
          SALES_IMAP_TIMEOUT_SECONDS: '45'
          SALES_MAX_EMAIL_CANDIDATES: '8'
        run: python import_sales.py

      - name: Снять точный срез продаж по действующим акциям
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          REPORT_MONTH="$(TZ=Europe/Minsk date +%Y-%m-01)"
          SOURCE_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail --silent --show-error \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/promotion_capture_sales_snapshots_v23654" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"p_report_month\":\"${REPORT_MONTH}\",\"p_source_message_at\":\"${SOURCE_AT}\"}"
