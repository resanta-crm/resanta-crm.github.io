name: TEMP Triovist sales refresh v23.6.117

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-triovist-sales-refresh-v236117.yml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl requests
      - name: Run Triovist sales importer
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRIOVIST_SALES_LOOKBACK_DAYS: '21'
          TRIOVIST_MAX_EMAIL_CANDIDATES: '20'
        run: python sync_triovist_sales.py
