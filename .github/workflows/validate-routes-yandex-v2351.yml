name: Validate routes and pilot v23.5.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/routes-yandex-validate-trigger-v2351'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check assets/09-manager-kpi-save-fix.js
          node --check assets/14-routes-yandex-ui-v2351.js
          node --check assets/15-routes-yandex-key-modal-v23511.js
          node --check assets/16-route-auto-pilot-v2352.js
      - name: Check route lifecycle guards
        run: |
          grep -q "recreatesOnRouteDomChange:true" assets/14-routes-yandex-ui-v2351.js
          grep -q "greenStatusOnlyWhenMapActive:true" assets/14-routes-yandex-ui-v2351.js
          grep -q "ymap.destroy" assets/14-routes-yandex-ui-v2351.js
      - name: Check pilot read-only guards
        run: |
          grep -q "readOnly:true" assets/16-route-auto-pilot-v2352.js
          grep -q "writes:false" assets/16-route-auto-pilot-v2352.js
          grep -q "manualRouteUntouched:true" assets/16-route-auto-pilot-v2352.js
          ! grep -Eq '\.(insert|update|delete|upsert)\(' assets/16-route-auto-pilot-v2352.js
      - name: Record validation
        run: |
          mkdir -p data
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('data/routes-yandex-validation.json',JSON.stringify({
            version:'v23.5.2',status:'ok',validated_at:new Date().toISOString(),
            checks:['09 bootstrap syntax','14 Yandex lifecycle syntax','15 key modal and pilot bridge syntax','16 read-only pilot syntax','route DOM lifecycle guards','pilot has no DB write methods'],
            note:'Route pilot is dry-run only: Aчинович 2026-08-10..14, current client/physical-point inputs + historical GPS/visits; manual routes remain untouched.'
          }));
          NODE
      - name: Commit validation result
        run: |
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/routes-yandex-validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Validate route pilot v23.5.2'
          git push
