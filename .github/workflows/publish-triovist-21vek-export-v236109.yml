name: Publish Triovist 21vek Excel export v23.6.109

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-triovist-21vek-export-v236109.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect Excel export and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root=Path('assets/66-performance-root-v23657.js')
          s=root.read_text(encoding='utf-8')
          s=re.sub(r"const V='23\.6\.\d+'", "const V='23.6.109'", s, count=1)
          needle="load('assets/80-triovist-21vek-control-v236107.js','perf-tri-21vek-control-v236107','RESANTA_TRIOVIST_21VEK_CONTROL_V236107')"
          addon="load('assets/81-triovist-21vek-export-v236109.js','perf-tri-21vek-export-v236109','RESANTA_TRIOVIST_21VEK_EXPORT_V236109')"
          if addon not in s:
              if needle not in s:
                  raise SystemExit('21vek control loader not found')
              s=s.replace(needle, needle+',\n    '+addon, 1)
          root.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          s=re.sub(r"const APP_VERSION = '2026-09-11-resanta-crm-v23\.6\.\d+';", "const APP_VERSION = '2026-09-11-resanta-crm-v23.6.109';", s, count=1)
          s=re.sub(r"assets/66-performance-root-v23657\.js\?v=23\.6\.\d+", "assets/66-performance-root-v23657.js?v=23.6.109", s, count=1)
          idx.write_text(s,encoding='utf-8')

          Path('data/app-version.json').write_text(json.dumps({
              'version':'23.6.109',
              'released_at':'2026-09-11',
              'purpose':'Triovist own 21vek: Excel export of current good working snapshot',
              'deploy_trigger':'2026-09-11T13:25:00Z'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          wf=Path('.github/workflows/publish-triovist-21vek-export-v236109.yml')
          wf.unlink()
          PY
      - name: Commit publish
        run: |
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/66-performance-root-v23657.js index.html data/app-version.json .github/workflows/publish-triovist-21vek-export-v236109.yml
          git commit -m 'Triovist: publish 21vek Excel export v23.6.109'
          git push
