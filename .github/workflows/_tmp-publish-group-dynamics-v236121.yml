name: TEMP publish Triovist groups v23.6.121
on:
  push:
    branches: [ main ]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch safe Triovist groups fixes
        run: python publish_group_dynamics_v236121.py
      - name: Validate JavaScript
        run: |
          node --check assets/83-triovist-group-dynamics-fixes-v236121.js
          node --check assets/32-triovist-v23611.js
          node --check assets/34-triovist-root-v23614.js
          node --check assets/66-performance-root-v23657.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish frontend v23.6.121" || exit 0
          git push
