name: TMP Promotions effectiveness v23.6.132

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-promotions-effectiveness-v236132.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wire promotions effectiveness
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const APP_VERSION = '2026-09-16-resanta-crm-v23.6.131';"
          new="const APP_VERSION = '2026-09-16-resanta-crm-v23.6.132';"
          if s.count(old)!=1: raise SystemExit('APP_VERSION guard failed')
          s=s.replace(old,new,1)
          old='<script defer src="./assets/66-performance-root-v23657.js?v=23.6.131"></script>'
          new='<script defer src="./assets/66-performance-root-v23657.js?v=23.6.132"></script>'
          if s.count(old)!=1: raise SystemExit('root guard failed')
          s=s.replace(old,new,1)
          anchor='<script defer src="./assets/68-vip-actions-nav-v23659.js?v=23.6.131"></script>'
          add=anchor+'\n<script defer src="./assets/88-promotions-effectiveness-v236132.js?v=23.6.132"></script>'
          if s.count(anchor)!=1: raise SystemExit('anchor guard failed')
          if '88-promotions-effectiveness-v236132.js' not in s:s=s.replace(anchor,add,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Wire promotions effectiveness v23.6.132'
          git push
