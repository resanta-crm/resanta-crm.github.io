name: TMP Manager new clients v23.6.135

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-manager-new-clients-v236135.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wire manager new-client dynamics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps=[
            ("const APP_VERSION = '2026-09-16-resanta-crm-v23.6.134';","const APP_VERSION = '2026-09-16-resanta-crm-v23.6.135';"),
            ('./assets/66-performance-root-v23657.js?v=23.6.134','./assets/66-performance-root-v23657.js?v=23.6.135'),
          ]
          for old,new in reps:
            if s.count(old)!=1: raise SystemExit('guard failed: '+old)
            s=s.replace(old,new,1)
          anchor='<script defer src="./assets/90-promotions-finish-v236134.js?v=23.6.134"></script>'
          add=anchor+'\n<script defer src="./assets/91-manager-new-clients-v236135.js?v=23.6.135"></script>'
          if s.count(anchor)!=1: raise SystemExit('anchor failed')
          if '91-manager-new-clients-v236135.js' not in s: s=s.replace(anchor,add,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Wire manager new clients v23.6.135'
          git push
