name: TEMP markdown refresh status v23.6.111

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-markdown-refresh-status-v236111.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python _tmp_patch_markdown_v236111.py

      - name: Validate
        run: |
          node --check assets/74-markdown-v23687.js
          node --check assets/66-performance-root-v23657.js
          python -m json.tool data/app-version.json >/dev/null
          git diff --check

      - name: Commit and clean one-shot files
        run: |
          git config user.name 'resanta-crm'
          git config user.email 'resantavitebsc@gmail.com'
          git rm .github/workflows/_tmp-markdown-refresh-status-v236111.yml _tmp_patch_markdown_v236111.py
          git add assets/74-markdown-v23687.js assets/66-performance-root-v23657.js index.html data/app-version.json
          git commit -m 'fix(markdown): refresh data and show 1C import status v23.6.111'
          git push origin HEAD:main
