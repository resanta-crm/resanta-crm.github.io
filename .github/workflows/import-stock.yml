name: Импорт остатков из почты в CRM

on:
  push:
    branches: [main]
    paths:
      - 'import_stock.py'
      - '.github/workflows/import-stock.yml'
  schedule:
    # Минск UTC+3. Письмо 1С обычно приходит около 09:30.
    # Запускаемся ПОСЛЕ письма и ещё несколько раз как страховка от задержек GitHub/Gmail.
    - cron: '45 6,9,12,15 * * *'   # 09:45, 12:45, 15:45, 18:45 Минск
  workflow_dispatch:

concurrency:
  group: vitebsk-stock-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check openpyxl requests

      - name: Обновить остаток склада Витебск
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STOCK_WAREHOUSE: 'Витебск'
          STOCK_LOOKBACK_DAYS: '10'
          STOCK_MAX_AGE_DAYS: '3'
          STOCK_SUBJECT_KEYS: 'остатк,crm,витебск'
          STOCK_IMAP_TIMEOUT_SECONDS: '45'
          STOCK_IMAP_ATTEMPTS: '3'
          STOCK_IMAP_RETRY_SECONDS: '6'
          STOCK_IMAP_HEADER_BATCH: '75'
          STOCK_MAX_EMAIL_CANDIDATES: '30'
        run: python import_stock.py
