name: TMP — Triovist heat gun market v23.6.261

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-triovist-heat-gun-v236261.yml'
  workflow_dispatch:

concurrency:
  group: triovist-heat-gun-v236261
  cancel-in-progress: true

jobs:
  heat-gun-market:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: |
          python -m py_compile tools/triovist_21vek_market.py tools/triovist_21vek_parser.py
          node --check assets/106-triovist-competitors-v236218.js
      - name: Dependencies
        run: pip install requests beautifulsoup4
      - name: Heat guns only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MARKET_VALIDATE_PROFILES: 'heat_gun'
          MARKET_DELAY_SECONDS: '0.22'
          MARKET_HTTP_TIMEOUT: '30'
          MARKET_SPEC_TTL_DAYS: '30'
        run: python tools/triovist_21vek_market.py
