name: Lera360 consented personal history and correction safety
on:
  pull_request:
    paths:
      - 'supabase/functions/crm-ai360-agent-v1/history.mjs'
      - 'supabase/functions/crm-ai360-agent-v1/index.ts'
      - 'supabase/functions/crm-ai360-agent-v1/conversation.mjs'
      - 'docs/sql/lera_ai360_history_30d_20261112.sql'
      - 'assets/217-lera360-history-v1.js'
      - 'assets/134-resanta-voice-ai360-pilot-v1.js'
      - 'assets/143-resanta-ai360-unified-dialog-v1.js'
      - 'assets/144-resanta-ai360-branch-voice-v1.js'
      - 'tests/lera360-private-history-feedback-v1.test.mjs'
      - '.github/workflows/lera360-private-history-30d-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/crm-ai360-agent-v1/history.mjs'
      - 'tests/lera360-private-history-feedback-v1.test.mjs'
permissions: { contents: read }
jobs:
  private-history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of all changed code
        run: |
          node --check supabase/functions/crm-ai360-agent-v1/history.mjs
          node --check supabase/functions/crm-ai360-agent-v1/conversation.mjs
          node --check assets/217-lera360-history-v1.js
          node --check assets/134-resanta-voice-ai360-pilot-v1.js
          node --check assets/143-resanta-ai360-unified-dialog-v1.js
          node --check assets/144-resanta-ai360-branch-voice-v1.js
          node --check --input-type=module < supabase/functions/crm-ai360-agent-v1/index.ts
      - name: Consent, strict ownership, deletion, TTL and corrected replies
        run: |
          node --test tests/lera360-private-history-feedback-v1.test.mjs
          node --test tests/ai360-agent360-conversation-routing-v1.test.mjs
          node --test tests/ai360-agent360-unified-gateway-v1.test.mjs
