name: AI360 debt evidence and natural followups
on:
  pull_request:
    paths:
      - 'supabase/functions/crm-ai360-dialog-v3/**'
      - 'assets/134-resanta-voice-ai360-pilot-v1.js'
      - 'assets/143-resanta-ai360-unified-dialog-v1.js'
      - 'assets/137-resanta-ai360-lazy-launch-v1.js'
      - 'index.html'
      - 'tests/ai360-conversation-debt-20261028.test.mjs'
      - '.github/workflows/ai360-conversation-debt-pr.yml'
permissions:
  contents: read
jobs:
  voice-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and conversation regression
        run: |
          node --check assets/134-resanta-voice-ai360-pilot-v1.js
          node --check assets/143-resanta-ai360-unified-dialog-v1.js
          node --check assets/137-resanta-ai360-lazy-launch-v1.js
          node --check supabase/functions/crm-ai360-dialog-v3/conversation.mjs
          node tests/ai360-conversation-debt-20261028.test.mjs
          node tests/ai360-unified-dialog-v1.test.cjs
          node tests/ai360-universal-browser-20261027.test.cjs
          node tests/ai360-voice-stt-429-regression-20261027.test.cjs
          node tests/ai360-task-approval-backend-v1.test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Strict server typecheck
        run: deno check supabase/functions/crm-ai360-dialog-v3/index.ts
