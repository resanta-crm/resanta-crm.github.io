name: hotfix-v236119

on:
  push:
    branches:
      - main
    paths:
      - hotfix_v236119.py
      - .github/workflows/_tmp-hotfix-v236119.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python hotfix_v236119.py
      - run: |
          git config user.name resanta-crm-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix: stop CRM reload loop v23.6.119"
          git pull --rebase origin main
          git push origin HEAD:main
