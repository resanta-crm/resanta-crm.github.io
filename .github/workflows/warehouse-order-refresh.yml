name: Подготовка данных для автозаказа — быстрый worker CRM
# v23.6.136 resilient 15-minute worker shifts

on:
  push:
    branches: [main]
    paths:
      - 'warehouse_order_refresh_worker.py'
      - '.github/workflows/warehouse-order-refresh.yml'
  schedule:
    # Короткая смена каждые 15 минут. Каждая живёт 13 минут:
    # почти непрерывное покрытие без зависимости от одной 3-часовой смены.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: warehouse-order-refresh-worker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check requests openpyxl

      - name: Проверить worker
        run: python -m py_compile warehouse_order_refresh_worker.py import_sales.py import_stock.py import_warehouse_cost.py

      - name: Быстро готовить данные для автозаказа
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          # Worker живёт 13 минут; следующая смена стартует каждые 15 минут.
          # Внутри очередь CRM проверяется каждые 15 секунд.
          WAREHOUSE_ORDER_WATCH_SECONDS: '780'
          WAREHOUSE_ORDER_POLL_SECONDS: '15'
          WAREHOUSE_ORDER_RETRY_SECONDS: '60'

          SALES_LOOKBACK_DAYS: '14'
          SALES_IMAP_TIMEOUT_SECONDS: '45'
          SALES_MAX_EMAIL_CANDIDATES: '8'

          STOCK_WAREHOUSE: 'Витебск'
          STOCK_LOOKBACK_DAYS: '10'
          STOCK_MAX_AGE_DAYS: '3'
          STOCK_SUBJECT_KEYS: 'остатк,crm,витебск'
          STOCK_IMAP_TIMEOUT_SECONDS: '45'
          STOCK_IMAP_ATTEMPTS: '3'
          STOCK_IMAP_RETRY_SECONDS: '6'
          STOCK_IMAP_HEADER_BATCH: '75'
          STOCK_MAX_EMAIL_CANDIDATES: '30'

          WAREHOUSE_COST_LOOKBACK_DAYS: '10'
          WAREHOUSE_COST_IMAP_TIMEOUT_SECONDS: '45'
        run: python warehouse_order_refresh_worker.py
