name: One-time Triovist AI v23.4.8 root

on:
  push:
    paths:
      - '.github/workflows/one-time-triovist-v2348-root.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cache-safe v23.4.8 root
        shell: python
        run: |
          from pathlib import Path

          p = Path('assets/10-manager-plans-root-v2330.js')
          s = p.read_text(encoding='utf-8')
          marker = 'RESANTA_TRIOVIST_AI_CACHE_SAFE_LOADER_V2348'
          if marker not in s:
              lines = [
                  '',
                  '/* v23.4.8 · permanent cache-safe Triovist AI bootstrap.',
                  ' * 09-manager-kpi-save-fix loads this file with Date.now(), so this bootstrap',
                  ' * works even when a browser still has an older index.html cached.',
                  ' */',
                  '(function loadTriovistAiCacheSafeV2348(){',
                  "  if(window.RESANTA_TRIOVIST_AI_PLANS_V2348||document.querySelector('script[data-triovist-ai-cache-safe-v2348]'))return;",
                  "  const x=document.createElement('script');",
                  "  x.src='./assets/11-triovist-ai-plans-v2348.js?_='+Date.now();",
                  '  x.async=false;',
                  "  x.dataset.triovistAiCacheSafeV2348='1';",
                  "  x.onerror=()=>console.warn('Triovist AI v23.4.8 failed to load; base CRM remains available.');",
                  '  document.head.appendChild(x);',
                  "  window.RESANTA_TRIOVIST_AI_CACHE_SAFE_LOADER_V2348=Object.freeze({version:'v23.4.8',noCache:true});",
                  '})();',
                  ''
              ]
              s = s.rstrip() + '\n' + '\n'.join(lines)
              p.write_text(s, encoding='utf-8')

          i = Path('index.html')
          h = i.read_text(encoding='utf-8')
          h = h.replace("const APP_VERSION = '2026-08-18-resanta-crm-v23.4.7';", "const APP_VERSION = '2026-08-18-resanta-crm-v23.4.8';")
          h = h.replace('./assets/09-manager-kpi-save-fix.js?v=23.4.7', './assets/09-manager-kpi-save-fix.js?v=23.4.8')
          h = h.replace('<script defer src="./assets/11-triovist-ai-plans-v2347.js?v=23.4.7" data-triovist-ai-root-v2347="1"></script>', '<script defer src="./assets/11-triovist-ai-plans-v2348.js?v=23.4.8" data-triovist-ai-root-v2348="1"></script>')
          i.write_text(h, encoding='utf-8')

      - name: Commit final root and remove installer
        run: |
          rm -f .github/workflows/one-time-triovist-v2348-root.yml
          git config user.name "resanta-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/10-manager-plans-root-v2330.js .github/workflows/one-time-triovist-v2348-root.yml
          git commit -m "Finalize cache-safe Triovist AI v23.4.8"
          git push
