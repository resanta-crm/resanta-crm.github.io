name: CONNECT 133 minimise and persistent screen share
on:
  pull_request:
    paths:
      - "assets/151-resanta-connect-v1.js"
      - "assets/154-resanta-connect-video-v1.js"
      - "assets/154-resanta-connect-video-v1.css"
      - "index.html"
      - "tests/connect-131.test.js"
      - "tests/connect-133.test.js"
      - ".github/workflows/connect-1*-check.yml"
  push:
    branches:
      - "feature/connect-133-call-minimize-workspace"
permissions:
  contents: read
jobs:
  persistent-call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JavaScript syntax and regression tests
        run: |
          node --check assets/151-resanta-connect-v1.js
          node --check assets/154-resanta-connect-video-v1.js
          node --check tests/connect-133.test.js
          node tests/connect-131.test.js
          node tests/connect-133.test.js
      - name: Prevent modifying non-CONNECT modules
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD > /tmp/connect133-files
          cat /tmp/connect133-files
          if grep -Ev '^(index\.html|assets/151-resanta-connect-v1\.js|assets/154-resanta-connect-video-v1\.(js|css)|tests/connect-(131|133)\.test\.js|\.github/workflows/connect-(126|127|128|131|133)-check\.yml)$' /tmp/connect133-files; then
            echo 'Non-CONNECT production change detected' >&2
            exit 1
          fi
