name: One-time Triovist AI root fix v23.4.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-root-fix-v2344.yml'

permissions:
  contents: write

jobs:
  root-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch root loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old_app = "const APP_VERSION = '2026-08-18-resanta-crm-v23.1.1';"
          new_app = "const APP_VERSION = '2026-08-18-resanta-crm-v23.4.4';"
          if old_app in s:
              s = s.replace(old_app, new_app, 1)
          elif new_app not in s:
              raise SystemExit('APP_VERSION anchor not found')

          old09 = '<script defer src="./assets/09-manager-kpi-save-fix.js?v=23.2.3"></script>'
          new09 = '<script defer src="./assets/09-manager-kpi-save-fix.js?v=23.4.4"></script>'
          if old09 in s:
              s = s.replace(old09, new09, 1)
          elif new09 not in s:
              raise SystemExit('09 script anchor not found')

          direct11 = '<script defer src="./assets/11-triovist-ai-plans-v2340.js?v=23.4.4" data-triovist-ai-root-v2344="1"></script>'
          if direct11 not in s:
              if new09 not in s:
                  raise SystemExit('Cannot place direct Triovist AI root')
              s = s.replace(new09, new09 + '\n' + direct11, 1)
          index.write_text(s, encoding='utf-8')

          root = Path('assets/10-manager-plans-root-v2330.js')
          t = root.read_text(encoding='utf-8')
          marker = '/* RESANTA CRM v23.4.0 · TRIOVIST AI PLANS BOOTSTRAP'
          if marker in t:
              t = t.split(marker, 1)[0].rstrip() + '\n'
          if 'RESANTA_MANAGER_PLANS_ROOT_V2330' not in t:
              raise SystemExit('Field-manager root damaged')
          root.write_text(t, encoding='utf-8')

          ai = Path('assets/11-triovist-ai-plans-v2340.js')
          u = ai.read_text(encoding='utf-8')
          u = u.replace('/* RESANTA CRM v23.4.3 · TRIOVIST AI PLANS · STOCK AWARE */',
                        '/* RESANTA CRM v23.4.4 · TRIOVIST AI PLANS · STOCK AWARE · DIRECT ROOT */', 1)
          u = u.replace("const V='v23.4.3'", "const V='v23.4.4'", 1)
          u = u.replace('if(window.RESANTA_TRIOVIST_AI_PLANS_V2343)return;',
                        'if(window.RESANTA_TRIOVIST_AI_PLANS_V2344)return;', 1)
          u = u.replace('window.RESANTA_TRIOVIST_AI_PLANS_V2343=Object.freeze({version:V,stockAware:true,managerGapVisible:true,exactGapArithmetic:true,noAutoSave:true,noSqlChanges:true});',
                        'window.RESANTA_TRIOVIST_AI_PLANS_V2343=Object.freeze({version:V,compat:true});window.RESANTA_TRIOVIST_AI_PLANS_V2344=Object.freeze({version:V,directRoot:true,stockAware:true,managerGapVisible:true,exactGapArithmetic:true,noAutoSave:true,noSqlChanges:true});', 1)
          if "const V='v23.4.4'" not in u or 'RESANTA_TRIOVIST_AI_PLANS_V2344' not in u:
              raise SystemExit('Triovist AI version patch failed')
          ai.write_text(u, encoding='utf-8')
          PY

      - name: Validate JavaScript and root anchors
        shell: bash
        run: |
          node --check assets/10-manager-plans-root-v2330.js
          node --check assets/11-triovist-ai-plans-v2340.js
          grep -F "const APP_VERSION = '2026-08-18-resanta-crm-v23.4.4';" index.html
          grep -F './assets/09-manager-kpi-save-fix.js?v=23.4.4' index.html
          grep -F './assets/11-triovist-ai-plans-v2340.js?v=23.4.4' index.html
          test "$(grep -c 'data-triovist-ai-root-v2344' index.html)" -eq 1
          ! grep -q 'TRIOVIST AI PLANS BOOTSTRAP' assets/10-manager-plans-root-v2330.js
          git diff --check

      - name: Commit root fix and remove installer
        shell: bash
        run: |
          git config user.name 'Resanta CRM Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-root-fix-v2344.yml
          git add index.html assets/10-manager-plans-root-v2330.js assets/11-triovist-ai-plans-v2340.js
          git commit -m 'Root-load Triovist AI v23.4.4'
          git push
