name: Triovist Search360 isolated tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/triovist_21vek_search360.py'
      - 'tools/test_triovist_21vek_search360.py'
      - 'assets/185-triovist-search360-v1.js'
      - 'supabase/migrations/*triovist_search360*'
      - 'index.html'
      - '.github/workflows/triovist-search360-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests beautifulsoup4
      - name: Isolated parser and UI tests
        run: |
          if [ -f tools/triovist_21vek_search360.py ]; then python -m py_compile tools/triovist_21vek_search360.py; fi
          if [ -f tools/test_triovist_21vek_search360.py ]; then python -m unittest discover -s tools -p 'test_triovist_21vek_search360.py' -v; fi
          if [ -f assets/185-triovist-search360-v1.js ]; then node --check assets/185-triovist-search360-v1.js; fi
      - name: Probe 21vek search UI links without bypass (one homepage)
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          try:
              r=requests.get('https://www.21vek.by/',headers={'User-Agent':'Mozilla/5.0 (compatible; ResantaCRM-Search360/1.0)'},timeout=14)
              print('homepage HTTP:',r.status_code,'bytes:',len(r.content))
              if r.status_code==200:
                  soup=BeautifulSoup(r.text,'html.parser')
                  scripts=[s.get('src') for s in soup.select('script[src]') if s.get('src')]
                  print('scripts:',len(scripts),'samples:',scripts[:10])
                  refs=re.findall(r'[\\\"\\\']([^\\\"\\\']*(?:suggest|complete|search-composer)[^\\\"\\\']*)[\\\"\\\']',r.text,re.I)
                  print('suggest/search references:',[x[:140] for x in refs[:12]])
          except Exception as e:
              print('Homepage probe unavailable:',type(e).__name__)
          PY
      - name: Read-only 21vek public search metadata (one request)
        run: |
          python - <<'PY'
          import requests
          try:
              h={'User-Agent':'ResantaCRM-21vekSearch360/1.0 (+https://resanta-crm.by)','Accept':'application/json','Origin':'https://www.21vek.by','Referer':'https://www.21vek.by/'}
              q={'query':'перфоратор','order':'default','page':1,'limit':60,'mode':'desktop','searchId':'','filters':[]}
              r=requests.post('https://gate.21vek.by/search-composer/api/v3/products',json=q,headers=h,timeout=14)
              print('search HTTP status:',r.status_code)
              if r.ok:
                  d=r.json()
                  print('search top-level keys:',sorted(d.keys())[:55])
                  for k,v in d.items():
                      if any(x in k.lower() for x in ('suggest','spell','correct','query','alternative','search')):
                          print('potential suggestion field:',k,type(v).__name__,str(v)[:220])
          except Exception as e:
              print('Search endpoint inspect inconclusive:',type(e).__name__)
          PY
