name: Triovist Search360 isolated integration and regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/triovist_21vek_search360.py'
      - 'tools/test_triovist_21vek_search360.py'
      - 'assets/185-triovist-search360-v1.js'
      - 'supabase/migrations/20261109_triovist_search360_isolated_v1.sql'
      - 'supabase/migrations/20261109_triovist_search360_negative_coverage_v2.sql'
      - 'index.html'
      - '.github/workflows/triovist-search360-ci.yml'
      - '.github/workflows/triovist-search360-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-search360:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests
      - name: Check new parser and UI syntax
        run: |
          python -m py_compile tools/triovist_21vek_search360.py
          node --check assets/185-triovist-search360-v1.js
          grep -q '185-triovist-search360-v1.js' index.html
      - name: Test live response shape, first suggestion ordering and deep ranking with fixtures
        run: python -m unittest discover -s tools -p 'test_triovist_21vek_search360.py' -v
      - name: Regression for older Triovist/Cards screens
        run: node --test tests/triovist-competitors-uni-listing.test.mjs tests/triovist-native-sections-v1.test.mjs tests/triovist-unix-director-v1.test.mjs
      - name: Preserve existing production parsers and restrict migration scope
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD > /tmp/search360-changed
          cat /tmp/search360-changed
          ! grep -E '^tools/(triovist_21vek_parser|triovist_21vek_top_shadow|triovist_21vek_shadow_sync|triovist_21vek_promote|triovist_21vek_market)[.]py$' /tmp/search360-changed
          ! (grep '^supabase/migrations/' /tmp/search360-changed | grep -v -E '^supabase/migrations/20261109_triovist_(search360_(isolated_v1|negative_coverage_v2)|decisions360_(task_facts|category_evidence)_v1)[.]sql$')
          ! grep -E 'TRUNCATE|DELETE FROM public[.](triovist_21vek|triovist_content)|DROP TABLE public[.]triovist_' supabase/migrations/20261109_triovist_search360_isolated_v1.sql
