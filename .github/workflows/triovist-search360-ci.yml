name: Triovist Search360 isolated tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/triovist_21vek_search360.py'
      - 'tools/test_triovist_21vek_search360.py'
      - 'assets/185-triovist-search360-v1.js'
      - 'supabase/migrations/*triovist_search360*'
      - 'index.html'
      - '.github/workflows/triovist-search360-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests beautifulsoup4
      - name: Isolated parser and UI tests
        run: |
          if [ -f tools/triovist_21vek_search360.py ]; then python -m py_compile tools/triovist_21vek_search360.py; fi
          if [ -f tools/test_triovist_21vek_search360.py ]; then python -m unittest discover -s tools -p 'test_triovist_21vek_search360.py' -v; fi
          if [ -f assets/185-triovist-search360-v1.js ]; then node --check assets/185-triovist-search360-v1.js; fi
      - name: Probe 21vek search UI links without bypass (one homepage)
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          try:
              r=requests.get('https://www.21vek.by/',headers={'User-Agent':'Mozilla/5.0 (compatible; ResantaCRM-Search360/1.0)'},timeout=14)
              print('homepage HTTP:',r.status_code,'bytes:',len(r.content))
              if r.status_code==200:
                  soup=BeautifulSoup(r.text,'html.parser')
                  scripts=[s.get('src') for s in soup.select('script[src]') if s.get('src')]
                  print('scripts:',len(scripts),'samples:',scripts[:10])
                  refs=re.findall(r'[\\\"\\\']([^\\\"\\\']*(?:suggest|complete|search-composer)[^\\\"\\\']*)[\\\"\\\']',r.text,re.I)
                  print('suggest/search references:',[x[:140] for x in refs[:12]])
          except Exception as e:
              print('Homepage probe unavailable:',type(e).__name__)
          PY
      - name: Find public autosuggest endpoint in 21vek frontend script references
        run: |
          python - <<'PY'
          import requests,re,concurrent.futures
          from bs4 import BeautifulSoup
          try:
              html=requests.get('https://www.21vek.by/',timeout=12).text
              js=[x.get('src') for x in BeautifulSoup(html,'html.parser').select('script[src]')
                  if (x.get('src') or '').startswith('https://cdn21vek.by/') and '.js' in x.get('src')]
              print('JS scanned:',len(js))
              def scan(url):
                  try:
                      z=requests.get(url,timeout=12)
                      if not z.ok or len(z.content)>2500000:return []
                      t=z.text
                      found=[]
                      for m in re.finditer(r'(?:search-composer|search-suggest|catalogSuggest|autoComplete|suggestions|autocomplete|suggest)',t,re.I):
                          span=t[max(0,m.start()-90):min(len(t),m.end()+90)]
                          if any(x in span for x in ('api/','https:','/suggest','/search')):
                              found.append(span[:170])
                          if len(found)>=6:break
                      return [(url.rsplit('/',1)[-1],x) for x in found]
                  except Exception:return []
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                  out=[x for pack in pool.map(scan,js) for x in pack]
              for name,excerpt in out[:18]:print('JS_REF',name,repr(excerpt))
          except Exception as e:print('bundle lookup inconclusive:',type(e).__name__)
          PY
      - name: Inspect public 21vek bundled search module metadata
        run: |
          python - <<'PY'
          import requests,re
          files=[
           'https://cdn21vek.by/desktop/_next/static/chunks/pages/_app-b7127587465ead02.js',
           'https://cdn21vek.by/desktop/_next/static/chunks/main-c11d326d01c88e96.js',
           'https://cdn21vek.by/desktop/_next/static/chunks/1232-070dd0645b975b63.js',
           'https://cdn21vek.by/desktop/_next/static/chunks/8104-6b385568c999fe9d.js',
           'https://cdn21vek.by/desktop/_next/static/chunks/5369-e2ab34dbdad4386e.js'
          ]
          for url in files:
              try:
                  r=requests.get(url,timeout=12)
                  print('JS_FILE',url.rsplit('/',1)[-1],r.status_code,len(r.content))
                  if not r.ok or len(r.content)>5000000:continue
                  t=r.text
                  hits=[]
                  for m in re.finditer('suggest|autocomplete|search-composer',t,re.I):
                      snippet=t[max(0,m.start()-130):m.end()+130]
                      if 'api/' in snippet or 'http' in snippet or 'fetch(' in snippet:
                          hits.append(snippet[:230])
                      if len(hits)>=4:break
                  for h in hits:print('JS_META',repr(h))
              except Exception as e:print('JS_FILE_ERROR',type(e).__name__)
          PY
      - name: Read-only 21vek public search metadata (one request)
        run: |
          python - <<'PY'
          import requests
          try:
              h={'User-Agent':'ResantaCRM-21vekSearch360/1.0 (+https://resanta-crm.by)','Accept':'application/json','Origin':'https://www.21vek.by','Referer':'https://www.21vek.by/'}
              q={'query':'перфоратор','order':'default','page':1,'limit':60,'mode':'desktop','searchId':'','filters':[]}
              r=requests.post('https://gate.21vek.by/search-composer/api/v3/products',json=q,headers=h,timeout=14)
              print('search HTTP status:',r.status_code)
              if r.ok:
                  d=r.json()
                  print('search top-level keys:',sorted(d.keys())[:55])
                  for k,v in d.items():
                      if any(x in k.lower() for x in ('suggest','spell','correct','query','alternative','search')):
                          print('potential suggestion field:',k,type(v).__name__,str(v)[:220])
          except Exception as e:
              print('Search endpoint inspect inconclusive:',type(e).__name__)
          PY
