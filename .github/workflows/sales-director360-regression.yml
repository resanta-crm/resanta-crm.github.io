name: Sales Director 360 regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/190-sales-director360-v1.js'
      - 'assets/191-sales360-recovery-lera-v1.js'
      - 'assets/134-resanta-voice-ai360-pilot-v1.js'
      - 'assets/137-resanta-ai360-lazy-launch-v1.js'
      - 'assets/144-resanta-ai360-branch-voice-v1.js'
      - 'docs/sales360_recovery_rpc_v4.sql'
      - 'tests/sales360-recovery-lera-v1.test.mjs'
      - 'docs/sales360_annual_rpc_v1.sql'
      - 'tests/sales-director360-v1.test.mjs'
      - '.github/workflows/sales-director360-regression.yml'
  push:
    branches: ['feature/sales-director360-20261110']
jobs:
  sales360:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |\n          node --check assets/190-sales-director360-v1.js\n          node --check assets/191-sales360-recovery-lera-v1.js\n          node --check assets/134-resanta-voice-ai360-pilot-v1.js\n          node --check assets/144-resanta-ai360-branch-voice-v1.js
      - name: Sales 360 isolated regressions
        run: node --test tests/sales-director360-v1.test.mjs tests/sales360-recovery-lera-v1.test.mjs
