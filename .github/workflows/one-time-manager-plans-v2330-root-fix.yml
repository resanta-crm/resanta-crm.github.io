name: One-time manager plans v23.3.0 root fix

on:
  push:
    paths:
      - '.github/workflows/one-time-manager-plans-v2330-root-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply unified manager-plans root fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Unified release/cache version in index.html.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r"const APP_VERSION = '[^']+';", "const APP_VERSION = '2026-08-18-resanta-crm-v23.3.0';", s, count=1)
          if n != 1: raise SystemExit('APP_VERSION replacement failed')
          for asset in ('07-ai-manager-plans.js','08-manager-gap-sources.js','09-manager-kpi-save-fix.js'):
              pattern = rf'(src="\.\/assets\/{re.escape(asset)}\?v=)[^"]+("\s*><\/script>)'
              s, n = re.subn(pattern, rf'\g<1>23.3.0\g<2>', s, count=1)
              if n != 1: raise SystemExit(f'loader replacement failed for {asset}')
          p.write_text(s, encoding='utf-8')

          # 2) AI-plan: expose the calculated object directly and emit an event.
          p = Path('assets/07-ai-manager-plans.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/* RESANTA CRM v23.2.1 · AI MANAGER PLANS · BUSINESS PLAN VS FORECAST',
                        '/* RESANTA CRM v23.3.0 · AI MANAGER PLANS · BUSINESS PLAN VS FORECAST', 1)
          s = s.replace("const VERSION='v23.2.1-business-plan-vs-forecast';",
                        "const VERSION='v23.3.0-business-plan-vs-forecast';", 1)
          s = s.replace('>v23.2.1</span>', '>v23.3.0</span>', 1)
          old = "const r=calcRecommendation(manager,month);lastRecommendation=r;"
          new = "const r=calcRecommendation(manager,month);lastRecommendation=r;\n    window.RESANTA_MANAGER_PLAN_LAST_RESULT=Object.freeze({...r});\n    try{window.dispatchEvent(new CustomEvent('resanta:manager-plan-calculated',{detail:window.RESANTA_MANAGER_PLAN_LAST_RESULT}));}catch(_){}"
          if s.count(old) != 1: raise SystemExit(f'AI result hook count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Gap-sources: consume the real calculation object first; DOM parsing only fallback.
          p = Path('assets/08-manager-gap-sources.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/* RESANTA CRM v23.2.2 · MANAGER PLAN GAP SOURCES',
                        '/* RESANTA CRM v23.3.0 · MANAGER PLAN GAP SOURCES', 1)
          s = s.replace("const VERSION='v23.2.2-manager-gap-sources';",
                        "const VERSION='v23.3.0-manager-gap-sources';", 1)
          old = """function renderGap(){
  const root=document.getElementById('manager-ai-plan-result-v2320');
  if(!root)return;
  const pf=extractPlanForecast(root);
  if(!pf.plan||!pf.forecast)return;
  const manager=document.getElementById('manager-plan-name')?.value||'';
  const targetMonth=ym(document.getElementById('manager-plan-month')?.value||'');
  if(!manager||!targetMonth)return;"""
          new = """function renderGap(){
  const root=document.getElementById('manager-ai-plan-result-v2320');
  if(!root)return;
  const manager=document.getElementById('manager-plan-name')?.value||'';
  const targetMonth=ym(document.getElementById('manager-plan-month')?.value||'');
  if(!manager||!targetMonth)return;
  const latest=window.RESANTA_MANAGER_PLAN_LAST_RESULT;
  let pf=null;
  if(latest&&sameManager(latest.manager,manager)&&ym(latest.targetMonth)===targetMonth){
    const plan=num(latest.recommendedShipment),forecast=num(latest.supported);
    pf={plan,forecast,gap:Math.max(0,plan-forecast)};
  }else{
    pf=extractPlanForecast(root);
  }
  if(!pf.plan||pf.forecast<0)return;"""
          if s.count(old) != 1: raise SystemExit(f'gap render hook count={s.count(old)}')
          s = s.replace(old, new, 1)
          anchor = "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();"
          event = "window.addEventListener('resanta:manager-plan-calculated',()=>{setTimeout(renderGap,0);setTimeout(renderGap,250);});\n"
          if s.count(anchor) != 1: raise SystemExit('gap boot anchor missing')
          s = s.replace(anchor, event + anchor, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Save: database is source of truth. Update existing row first; insert only if absent.
          # If a race still causes 23505, re-read and update — duplicate key cannot block the boss.
          p = Path('assets/09-manager-kpi-save-fix.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/* RESANTA CRM v23.2.3 · MANAGER KPI SAVE FIX',
                        '/* RESANTA CRM v23.3.0 · MANAGER KPI SAVE ROOT FIX', 1)
          s = s.replace("if(window.RESANTA_MANAGER_KPI_SAVE_FIX_V2323)return;",
                        "if(window.RESANTA_MANAGER_KPI_SAVE_FIX_V2330)return;", 1)
          old = """  const {data,error}=await db.from('manager_kpi_plans')
    .upsert(row,{onConflict:'manager_name,period_month'})
    .select().single();

  if(error){alert('Не удалось сохранить план: '+error.message);return;}
"""
          new = """  let data=null,error=null;
  const foundRes=await db.from('manager_kpi_plans')
    .select('*')
    .eq('manager_name',manager_name)
    .eq('period_month',period_month)
    .maybeSingle();
  if(foundRes.error){alert('Не удалось проверить существующий план: '+foundRes.error.message);return;}

  if(foundRes.data?.id){
    ({data,error}=await db.from('manager_kpi_plans').update(row).eq('id',foundRes.data.id).select().single());
  }else{
    ({data,error}=await db.from('manager_kpi_plans').insert({...row,created_by:currentProfile?.name||null}).select().single());
    if(error&&String(error.code||'')==='23505'){
      const retry=await db.from('manager_kpi_plans')
        .select('*')
        .eq('manager_name',manager_name)
        .eq('period_month',period_month)
        .maybeSingle();
      if(!retry.error&&retry.data?.id){
        ({data,error}=await db.from('manager_kpi_plans').update(row).eq('id',retry.data.id).select().single());
      }
    }
  }

  if(error||!data){alert('Не удалось сохранить план: '+(error?.message||'не получена сохранённая запись'));return;}
"""
          if s.count(old) != 1: raise SystemExit(f'save block count={s.count(old)}')
          s = s.replace(old, new, 1)
          s = s.replace("window.RESANTA_MANAGER_KPI_SAVE_FIX_V2323=Object.freeze({",
                        "window.RESANTA_MANAGER_KPI_SAVE_FIX_V2330=Object.freeze({", 1)
          s = s.replace("version:'v23.2.3',", "version:'v23.3.0',", 1)
          p.write_text(s, encoding='utf-8')
          PY

          node --check assets/07-ai-manager-plans.js
          node --check assets/08-manager-gap-sources.js
          node --check assets/09-manager-kpi-save-fix.js

          # Ensure only the intended files changed.
          changed="$(git diff --name-only | sort)"
          expected=$'assets/07-ai-manager-plans.js\nassets/08-manager-gap-sources.js\nassets/09-manager-kpi-save-fix.js\nindex.html'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi

          rm .github/workflows/one-time-manager-plans-v2330-root-fix.yml
          git config user.name 'resanta-crm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/07-ai-manager-plans.js assets/08-manager-gap-sources.js assets/09-manager-kpi-save-fix.js .github/workflows/one-time-manager-plans-v2330-root-fix.yml
          git commit -m 'Unify manager plans release v23.3.0 and fix save/gap roots'
          git push origin HEAD:main
