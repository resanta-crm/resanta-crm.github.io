<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>РЕСАНТА CRM · Ревизор склада</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#18273b;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:0 auto;padding:22px}
header{background:#123e69;color:#fff;padding:18px 0}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:0;padding-bottom:0}
header small{display:block;opacity:.82;margin-top:5px}button{cursor:pointer;font:inherit;border-radius:9px;padding:10px 14px;border:1px solid #cad8e5;background:white;color:#123e69}
button.primary{background:#1761a2;color:#fff;border-color:#1761a2}button.active{background:#dceeff;border-color:#1761a2}
button:disabled{opacity:.5;cursor:default}.hidden{display:none!important}
.card{background:#fff;border:1px solid #e1e7ed;border-radius:14px;padding:18px;margin-bottom:16px}
h1{font-size:21px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}
.muted{font-size:12px;color:#6d7c8c}.warn{padding:12px;border-radius:9px;background:#fff2e8;color:#813d12;margin:10px 0}
.login{max-width:460px;margin:10vh auto}.login label{display:block;font-size:12px;margin:12px 0 4px}
.login input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
.tile{flex:1;min-width:200px;text-align:left;padding:18px;min-height:82px;font-size:18px;font-weight:650}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0 18px}
.metric{border:1px solid #e0e6ed;background:#f9fbfd;padding:13px;border-radius:11px}.metric b{display:block;font-size:21px;margin-top:7px}
table{border-collapse:collapse;width:100%;min-width:750px}th,td{border-bottom:1px solid #e8edf2;text-align:left;padding:9px;font-size:12px}th{background:#f5f8fc}
.scroll{overflow-x:auto}.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=search]{border:1px solid #cdd7e1;border-radius:8px;padding:9px;font:inherit}
#notice{margin:12px 0;color:#9a2626}.pill{font-size:11px;border-radius:8px;padding:4px 7px;background:#f0f4f8}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<header><div class="wrap"><div><h1>РЕСАНТА CRM · Склад</h1><small>Роль: Ревизор · Витебск · только просмотр</small></div><button id="logout" class="hidden">Выйти</button></div></header>
<main class="wrap">
<section id="auth" class="card login hidden">
<h2>Вход ревизора</h2><p class="muted">Используйте личную учётную запись РЕСАНТА CRM.</p>
<form id="login-form"><label for="email">Почта</label><input id="email" type="email" required autocomplete="username" value="sazonov_ks@resanta.ru"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"><div class="actions"><button class="primary" type="submit">Войти</button></div></form><div id="auth-error" class="warn hidden"></div></section>
<section id="panel" class="hidden">
<div class="card"><strong id="identity">Склад Витебск</strong><div class="muted">Никаких изменений остатков, приёмки, курсов и заказов в режиме ревизора не выполняется.</div>
<div class="actions"><button class="tile active" data-tab="excess">🔴 Перелимит</button><button class="tile" data-tab="inventory">📋 Инвентаризация</button><button class="tile" data-tab="receiving">📥 Приёмка товара</button></div></div>
<div id="notice" role="alert"></div><div class="card" id="content">Загружаю данные…</div>
</section>
</main>
<script>
(function(){
'use strict';
const SUPABASE_URL="https://baqchjtvtmcfzwjjluhs.supabase.co";
const SUPABASE_KEY="sb_publishable_BzH2PH0XD4jXrWYcbcs5FA_28uIMFbd";
let client=null;
let mode='excess';
let chosenMonth=null;
let lastMonths=[];
let generation=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const num=s=>Number(s||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
const money=s=>num(s)+' бел. руб.';
const when=s=>s?esc(String(s).slice(0,10)):'—';
function showError(e){$('notice').textContent=String(e?.message||e||'Неизвестная ошибка')}
async function rpc(name,args){const r=await client.rpc(name,args||{});if(r.error)throw r.error;return r.data}
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function metric(title,value){return '<div class="metric"><span class="muted">'+esc(title)+'</span><b>'+esc(value)+'</b></div>'}
async function verify(){
 const result=await client.auth.getUser();
 if(result.error||!result.data?.user){$('auth').classList.remove('hidden');$('panel').classList.add('hidden');$('logout').classList.add('hidden');return}
 const allowed=await rpc('crm_warehouse_auditor_v1');
 if(!allowed){$('auth').classList.remove('hidden');$('panel').classList.add('hidden');$('auth-error').classList.remove('hidden');$('auth-error').textContent='Эта учётная запись не имеет роли «Ревизор». Обратитесь к руководителю.';$('logout').classList.remove('hidden');return}
 $('auth').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden');
 $('identity').textContent='Ревизор: Сазонов Кирилл Сергеевич';
 await load();
}
async function load(){
 const token=++generation;$('notice').textContent='';$('content').textContent='Загружаю склад…';
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===mode));
 try{
  if(mode==='excess'){
   const months=await rpc('warehouse_auditor_months_v1');
   if(token!==generation)return;
   lastMonths=Array.isArray(months)?months:[];
   if(!chosenMonth&&lastMonths.length)chosenMonth=String(lastMonths[0].month||lastMonths[0].report_month||'').slice(0,7);
   const date=chosenMonth?chosenMonth+'-01':null;
   const d=await rpc('warehouse_auditor_get_dashboard_v1',{p_month:date});
   if(token!==generation)return;
   const data=await rpc('warehouse_auditor_get_items_v1',{p_month:date,p_mode:'excess',p_search:'',p_limit:100,p_offset:0});
   if(token!==generation)return;
   const opts=lastMonths.map(m=>{const x=String(m.month||m.report_month||'').slice(0,7);return '<option value="'+esc(x)+'"'+(x===chosenMonth?' selected':'')+'>'+esc(x)+'</option>'}).join('');
   let out='<h2>Склад · перелимит</h2><div class="filters"><label>Месяц <select id="month">'+opts+'</select></label><button id="refresh">Обновить</button></div>';
   if(!d?.has_data){$('content').innerHTML=out+'<div class="muted">Отчёт себестоимости пока не загружен.</div>';return}
   out+='<div class="metrics">'+metric('Остаток по себестоимости',money(d.closing_cost_byn))+metric('Расход месяца',money(d.expense_cost_byn))+metric('Перелимит сейчас',money(d.current_overlimit_byn))+metric('Прогноз перелимита',money(d.forecast_overlimit_byn))+metric('Возможная сумма 1%',money(d.current_penalty_byn))+metric('Излишки SKU',num(d.excess_sku))+'</div>';
   out+='<p class="muted">Данные 1С: '+when(d.report_date)+' · Показано '+num((data?.rows||[]).length)+' из '+num(data?.total)+' SKU. Результаты только для просмотра.</p>';
   const rows=(data?.rows||[]).map(x=>[x.sku,x.product,x.vitebsk_avail,x.forecast_qty,x.target_qty,x.excess_qty,money(x.excess_cost_byn)]);
   out+=table(['Артикул','Товар','Остаток Витебск','Прогноз','Цель','Излишек','Излишек по себестоимости'],rows);
   $('content').innerHTML=out; bindMonth();
  }else if(mode==='inventory'){
   const d=await rpc('warehouse_auditor_inventory_summary_v1',{p_session_id:null,p_mode:'all',p_search:'',p_limit:100,p_offset:0});
   if(token!==generation)return;
   let out='<h2>📋 Инвентаризация</h2><p class="muted">Режим просмотра. Сканирование и закрытие инвентаризации недоступны.</p>';
   if(!d?.has_session){$('content').innerHTML=out+'<div class="muted">Проведённых инвентаризаций пока нет.</div>';return}
   const k=d.kpi||{},sess=d.session||{};
   out+='<p class="muted">Статус: '+esc(sess.status)+' · Создана: '+when(sess.started_at)+' · Остаток: '+when(sess.stock_report_date)+'</p>';
   out+='<div class="metrics">'+metric('Посчитано SKU',num(k.counted_sku))+metric('Не посчитано SKU',num(k.uncounted_sku))+metric('Расхождений SKU',num(k.diff_sku))+metric('Разница, шт.',num(k.difference_qty))+'</div>';
   out+=table(['Артикул','Товар','Учёт','Факт','Разница','Последний пересчёт'],(d.rows||[]).map(x=>[x.sku,x.product,x.system_qty_onhand,x.counted_qty,x.difference,when(x.last_counted_at)]));
   $('content').innerHTML=out;
  }else{
   const docs=await rpc('warehouse_auditor_receiving_list_v1',{p_limit:50});
   if(token!==generation)return;
   let out='<h2>📥 Приёмка товара</h2><p class="muted">Журнал приёмок склада Витебск. Редактирование, сканирование и закрытие недоступны.</p>';
   out+=table(['Документ','Дата','Статус','План SKU','Принято SKU','Принято, шт.','Недостачи SKU'],(Array.isArray(docs)?docs:[]).map(x=>[x.document_no,when(x.document_date),x.status,x.expected_sku_count,x.touched_sku_count,x.received_qty,x.short_sku_count]));
   $('content').innerHTML=out;
  }
 }catch(e){if(token===generation){showError(e);$('content').textContent='Не удалось получить данные. Обновите раздел или обратитесь к руководителю.'}}
}
function bindMonth(){const m=$('month'),b=$('refresh');if(m)m.onchange=()=>{chosenMonth=m.value;load()};if(b)b.onclick=()=>load()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.tab;load()}));
$('logout').addEventListener('click',async()=>{await client.auth.signOut({scope:'local'});$('auth-error').classList.add('hidden');await verify()});
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('auth-error').classList.add('hidden');const b=$('login-form').querySelector('button');b.disabled=true;try{const r=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;$('password').value='';await verify()}catch(err){$('auth-error').textContent=err?.message||'Ошибка входа';$('auth-error').classList.remove('hidden')}finally{b.disabled=false}});
function init(){if(!window.supabase){$('auth').classList.remove('hidden');$('auth-error').classList.remove('hidden');$('auth-error').textContent='Библиотека авторизации не загрузилась. Проверьте интернет.';return}
 client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 verify().catch(e=>{$('auth').classList.remove('hidden');$('auth-error').classList.remove('hidden');$('auth-error').textContent=e?.message||'Ошибка доступа'})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
</body></html>
