plugins {
  id 'com.android.application'
}
android {
  namespace 'by.resanta.air3probe'
  compileSdk 35
  defaultConfig {
    applicationId 'by.resanta.air3probe'
    minSdk 28
    targetSdk 34
    versionCode 2
    versionName '0.2-mic-test'
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
